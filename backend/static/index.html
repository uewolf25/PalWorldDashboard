}

function renderDashboard(root) {
  const cards = el("div", { class: "statcards" });
  const restartBox = el("div");
  const announceBox = el("div");
  const historyBox = el("div");
  const nextBox = el("div");
  const feedBox = el("div");

  root.appendChild(el("div", { class: "pagehead" }, [
    el("div", null, [
      el("h1", { text: "ダッシュボード" }),
      el("div", { class: "lead", text: "サーバの状態と直近の動きをまとめて表示します。" }),
    ]),
  ]));
  root.appendChild(cards);
  root.appendChild(restartBox);
  root.appendChild(el("div", { class: "dashgrid" }, [
    el("div", { class: "dashcol" }, [announceBox, historyBox]),
    el("div", { class: "dashcol" }, [nextBox, feedBox]),
  ]));

  // --- アナウンス送信 ---
  const MAX_LEN = 500;   // サーバ側の上限に合わせる
  const announceInput = el("input", {
    type: "text", placeholder: "全体に流すメッセージ…", style: "flex:1;min-width:180px",
  });
  const counter = el("span", { class: "counter", text: "0 / " + MAX_LEN });
  let toDiscord = false;

  announceInput.addEventListener("input", () => {
    const n = [...announceInput.value].length;
    counter.textContent = n + " / " + MAX_LEN;
    counter.className = "counter" + (n > MAX_LEN ? " over" : "");
  });

  async function sendAnnounce() {
    const message = announceInput.value.trim();
    if (!message) return;
    try {
      await post("/api/announce", { message, to_discord: toDiscord });
      announceInput.value = "";
      announceInput.dispatchEvent(new Event("input"));
      toast("アナウンスを送信しました", "ok");
      loadHistory();
      loadFeed();
    } catch (e) { toast(e.message, "err"); }
  }
  announceInput.addEventListener("keydown", (ev) => { if (ev.key === "Enter") sendAnnounce(); });

  function paintAnnounce() {
    const cfg = state.config || {};
    const hasWebhook = !!cfg.discord_webhook_url;

    const discordChip = el("span", {
      class: "target tap" + (toDiscord ? " on" : ""),
      title: hasWebhook ? "クリックで切り替え" : "DISCORD_WEBHOOK_URL が未設定です",
      onclick: () => {
        if (!hasWebhook) { toast("Discord の Webhook が設定されていません", "err"); return; }
        toDiscord = !toDiscord;
        paintAnnounce();
      },
    }, [el("span", { class: "lamp" }), "Discord"]);

    clear(announceBox);
    announceBox.appendChild(el("div", { class: "panel" }, [
      el("div", { class: "cardhead" }, [el("div", { class: "t", text: "アナウンス" }), counter]),
      readOnlyNote("アナウンスの送信にはログインが必要です。履歴の閲覧はできます。"),
      el("div", { class: "row", style: "flex-wrap:nowrap" }, [
        gate(announceInput),
        gate(el("button", { class: "btn primary", text: "送信", onclick: sendAnnounce })),
      ]),
      el("div", { class: "targets" }, [
        // ゲーム内は常に送る。切り替えられないので押せる見た目にしない
        el("span", { class: "target on" }, [el("span", { class: "lamp" }), "ゲーム内"]),
        hasWebhook ? discordChip
                   : el("span", { class: "target", title: "DISCORD_WEBHOOK_URL が未設定です" },
                        [el("span", { class: "lamp" }), "Discord（未設定）"]),
        el("span", { class: "note", text: announceNote }),
      ]),
    ]));
  }

  // 直近の Discord 送信の結果。連携が生きているかの手掛かりにする
  let announceNote = "";

  // --- アナウンス履歴 ---
  let historyLimit = 5;
  async function loadHistory() {
    let data;
    try { data = await api("/api/announcements?limit=30"); }
    catch (e) { return; }

    const records = data.records;
    const lastDiscord = records.find(r => r.to_discord);
    announceNote = !(state.config && state.config.discord_webhook_url)
      ? "Discord は未設定です"
      : lastDiscord
        ? (lastDiscord.ok ? "Discord 連携は正常（最終送信 " + fmtClock(lastDiscord.ts) + "）"
                          : "直近の Discord 送信に失敗しています")
        : "Discord へはまだ送信していません";
    paintAnnounce();

    clear(historyBox);
    const head = el("div", { class: "cardhead" }, [
      el("div", { class: "t", text: "アナウンス履歴" }),
      records.length > 5 ? el("button", {
        class: "more", text: historyLimit === 5 ? "すべて表示" : "折りたたむ",
        onclick: () => { historyLimit = historyLimit === 5 ? 30 : 5; loadHistory(); },
      }) : null,
    ]);
    historyBox.appendChild(el("div", { class: "panel", style: "padding:22px 0 0" }, [
      el("div", { style: "padding:0 22px" }, head),
      records.length
        ? announcementTable(records.slice(0, historyLimit))
        : el("div", { class: "muted", style: "padding:0 22px 22px", text: "アナウンス履歴はまだありません" }),
    ]));
  }

  // --- 次回の予定 ---
  async function loadNext() {
    let data;
    try { data = await api("/api/schedules"); }
    catch (e) { return; }

    const active = data.schedules.filter(s => s.enabled && s.next_action_at);
    clear(nextBox);

    if (!active.length) {
      nextBox.appendChild(el("div", { class: "panel" }, [
        el("div", { class: "cardhead" }, [
          el("div", { class: "t", text: "次回の予定" }),
          el("button", { class: "more", text: "スケジュール", onclick: () => setView("schedules") }),
        ]),
        el("div", { class: "muted small", text: "有効な予約はありません" }),
      ]));
      return;
    }

    const next = active[0];
    const remain = Math.max(0, (new Date(next.next_action_at).getTime() - Date.now()) / 1000);
    const rest = active.slice(1, 4);

    nextBox.appendChild(el("div", { class: "panel nextcard" }, [
      el("div", { class: "cardhead" }, [
        el("div", { class: "t", text: "次回の予定" }),
        el("button", { class: "more", text: "スケジュール", onclick: () => setView("schedules") }),
      ]),
      el("div", { class: "row", style: "gap:8px;margin-bottom:10px" }, [
        el("span", { class: "tag-changed", text: next.action_label }),
        el("span", { class: "tag-added", style: "background:#17334b;color:#9dbdd6",
          text: { daily: "毎日", once: "単発", cron: "cron" }[next.kind] || next.kind }),
        next.skip_next ? el("span", { class: "tag-unknown", text: "今回は見送り" }) : null,
      ]),
      el("div", { class: "when", text: fmtTime(next.next_action_at) }),
      el("div", { class: "mono small muted", style: "margin-top:8px",
        text: next.skip_next ? "この回は実行されません" : "あと " + fmtDuration(remain) }),
      el("div", { class: "small muted", style: "margin-top:12px" }, [
        next.announced && next.notice_offsets && next.notice_offsets.length
          ? "予告 " + next.notice_offsets.map(offsetLabel).join(" / ") : "予告なし",
        next.pending_changes ? " ・ 設定変更 " + next.pending_changes + " 件を同時反映" : null,
      ]),
      el("div", { class: "row", style: "margin-top:16px" }, [
        gate(el("button", {
          class: "btn small", text: "編集", style: "flex:1",
          onclick: () => setView("schedules"),
        })),
        gate(el("button", {
          class: "btn small", text: next.skip_next ? "見送りをやめる" : "今回はスキップ",
          style: "flex:1",
          onclick: async () => {
            try {
              await patch("/api/schedules/" + next.id, { skip_next: !next.skip_next });
              toast(next.skip_next ? "見送りを取り消しました" : "次の1回だけ見送ります", "ok");
              loadNext();
            } catch (e) { toast(e.message, "err"); }
          },
        })),
      ]),
      rest.length ? el("div", { style: "border-top:1px solid var(--line);margin:18px 0 14px" }) : null,
      rest.length ? el("div", { class: "small muted", style: "margin-bottom:10px", text: "そのあとの予定" }) : null,
      rest.length ? el("div", { class: "upcoming" }, rest.map(s => el("div", { class: "it" }, [
        el("span", { class: "tag-added", style: "background:#17334b;color:#9dbdd6", text: s.action_label }),
        el("span", { class: "at", text: fmtTime(s.next_action_at).replace(/^\d{4}\//, "") }),
        el("span", { class: "rel",
          text: fmtDuration(Math.max(0, (new Date(s.next_action_at).getTime() - Date.now()) / 1000)) + "後" }),
      ]))) : null,
    ]));
  }

  // --- 直近のアクティビティ ---
  /** 入退室・アナウンス・ログを1本の時系列にまとめる。
   *
   *  それぞれ別の画面に散っているものを、起きた順に並べ直すだけ。
   *  専用の API は作らず、既にあるものを混ぜている。
   */
  async function loadFeed() {
    let events = [], announces = [], logs = [];
    try {
      const [e, a, l] = await Promise.all([
        api("/api/players/events?limit=10"),
        api("/api/announcements?limit=10"),
        api("/api/logs"),
      ]);
      events = e.events; announces = a.records; logs = l.lines;
    } catch (err) { return; }

    const items = [];
    for (const e of events) {
      items.push({
        ts: e.ts,
        tag: e.kind === "join" ? "JOIN" : "LEFT",
        color: e.kind === "join" ? "var(--ok)" : "var(--crit)",
        msg: e.name + (e.kind === "join" ? " が参加しました" : " が退出しました"),
      });
    }
    for (const a of announces) {
      const to = [a.to_game ? "ゲーム内" : null, a.to_discord ? "Discord" : null].filter(Boolean).join(" / ");
      items.push({
        ts: a.ts,
        tag: a.ok ? "SEND" : "FAIL",
        color: a.ok ? "#7fd1ff" : "var(--crit)",
        msg: "アナウンス「" + a.message + "」" + (to ? " " + to : ""),
      });
    }
    for (const l of logs.slice(-20)) {
      items.push({
        ts: l.ts,
        tag: (l.level || "info").toUpperCase(),
        color: l.level === "error" ? "var(--crit)" : l.level === "warn" ? "var(--warn)" : "var(--muted)",
        msg: l.line,
      });
    }
    items.sort((a, b) => b.ts - a.ts);

    clear(feedBox);
    feedBox.appendChild(el("div", { class: "panel" }, [
      el("div", { class: "cardhead" }, [
        el("div", { class: "t", text: "直近のアクティビティ" }),
        el("button", { class: "more", text: "ログ", onclick: () => setView("logs") }),
      ]),
      items.length
        ? el("div", { class: "feed" }, items.slice(0, 12).map(i => el("div", { class: "it" }, [
            el("span", { class: "at", text: fmtClock(i.ts) }),
            el("span", { class: "tag", style: "color:" + i.color, text: i.tag }),
            el("span", { class: "msg", text: i.msg }),
          ])))
        : el("div", { class: "muted small", text: "まだ動きがありません" }),
    ]));
  }

  // --- 指標カード ---
  let sparks = { fps: [], cpu: [], playersPeak: null };

  function paint(s) {
    const m = s.metrics || {}, h = s.host || {};
    clear(cards);

    // 状態
    const online = s.online;
    cards.appendChild(statcard("状態",
      el("div", { class: "state", style: "color:" + (online ? "var(--ok)" : "var(--crit)") }, [
        el("span", { class: "statusdot " + (online ? "online" : "offline") }),
        el("span", { text: online ? "稼働中" : "応答なし" }),
      ]),
      lastSavedText,
    ));

    // サーバFPS
    cards.appendChild(statcard("サーバFPS",
      bigValue(m.serverfps !== undefined ? m.serverfps : "-", "", "var(--accent)"),
      m.serverframetime !== undefined ? m.serverframetime + "ms" : "",
      sparkline(sparks.fps, "#4cc2ff"),
    ));

    // プレイヤー
    const cur = m.currentplayernum, max = m.maxplayernum;
    const SEGMENTS = 6;
    const lit = (typeof cur === "number" && typeof max === "number" && max > 0)
      ? Math.min(SEGMENTS, cur === 0 ? 0 : Math.max(1, Math.ceil(cur / max * SEGMENTS)))
      : 0;
    const seg = el("div", { class: "segbar" });
    for (let i = 0; i < SEGMENTS; i++) {
      seg.appendChild(el("span", { class: i < lit ? "on" : "" }));
    }
    cards.appendChild(statcard("プレイヤー",
      el("div", { class: "v" }, [
        String(cur !== undefined ? cur : "-"),
        el("span", { class: "unit", text: " / " + (max !== undefined ? max : "-") }),
      ]),
      sparks.playersPeak !== null ? "直近1hのピーク " + sparks.playersPeak : "",
      seg,
    ));

    // CPU
    cards.appendChild(statcard("CPU",
      bigValue(h.cpu_percent !== undefined ? h.cpu_percent.toFixed(1) : "-", "%"),
      h.cpu_count ? h.cpu_count + " vCPU" : "",
      sparkline(sparks.cpu, "#5b86a8"),
    ));

    // メモリ
    const mem = h.mem_percent;
    const memColor = mem >= 90 ? "var(--crit)" : mem >= 80 ? "var(--warn)" : "#fff";
    const bar = el("div", { class: "meter" },
      el("i", {
        style: "width:" + Math.min(100, mem || 0) + "%;background:"
          + (mem >= 90 ? "linear-gradient(90deg,#ff8fa3,#e5566e)"
             : mem >= 80 ? "linear-gradient(90deg,#ffc44d,#f2a25c)"
             : "linear-gradient(90deg,#4cc2ff,#67c7f5)"),
      }));
    cards.appendChild(statcard("メモリ",
      bigValue(mem !== undefined ? mem.toFixed(1) : "-", "%", memColor),
      h.mem_used_mb !== undefined
        ? h.mem_used_mb.toLocaleString() + " / " + h.mem_total_mb.toLocaleString() + " MB" : "",
      bar,
    ));

    // 進行中のシーケンス
    clear(restartBox);
    const r = s.restart || {};
    if (r.in_progress) {
      const remain = r.seconds_remaining;
      restartBox.appendChild(el("div", { class: "panel", style: "margin-top:16px" },
        el("div", { class: "row" }, [
          el("strong", { text: r.mode_label + "シーケンス進行中" }),
          el("span", { class: "muted", text: "(" + r.phase + ") " + r.message }),
          remain !== null && remain !== undefined ? el("span", { class: "mono", text: "残り " + fmtDuration(remain) }) : null,
          r.cancellable ? gate(el("button", {
            class: "btn small danger", text: "キャンセル",
            onclick: () => openModal({
              title: r.mode_label + "をキャンセルします",
              lead: "予告済みのプレイヤーにキャンセルを通知します。",
              confirmLabel: "キャンセルする",
              async onConfirm() {
                await post("/api/restart/cancel");
                toast(r.mode_label + "をキャンセルしました", "ok");
                loadHistory();
              },
            }),
          })) : null,
        ])));
      showBanner(r.mode_label + "シーケンスが進行中です: " + r.message, "warn");
    } else {
      showBanner(s.online ? "" : "Palworld サーバに接続できません: " + (s.error || ""), "crit");
    }
  }

  // スパークラインと「直近1hのピーク」は履歴から作る。
  // 1秒ごとに取り直す必要はないので、更新はゆっくりでよい
  let lastSavedText = "";
  async function loadTrends() {
    try {
      const data = await api("/api/history?minutes=60");
      sparks.fps = data.records.map(r => r.fps).filter(v => typeof v === "number").slice(-40);
      sparks.cpu = data.records.map(r => r.cpu_percent).filter(v => typeof v === "number").slice(-40);
      const nums = data.records.map(r => r.players).filter(v => typeof v === "number");
      sparks.playersPeak = nums.length ? Math.max.apply(null, nums) : null;
    } catch (e) { /* 指標カードは status だけでも出る */ }

    try {
      const w = await api("/api/world/backups");
      lastSavedText = w.last_saved_at ? "最終保存 " + fmtTime(w.last_saved_at) : "";
    } catch (e) { /* セーブ情報が無くてもカードは出す */ }
  }

  let wasInProgress = false;
  async function tick() {
    try {
      const s = await api("/api/status");
      state.status = s;
      paint(s);
      buildTopbar();   // 1秒ごとに見ているので、上部バーもここで更新する
      // シーケンスが終わったタイミングで履歴を取り直す
      const now = !!(s.restart && s.restart.in_progress);
      if (wasInProgress && !now) { loadHistory(); loadNext(); loadFeed(); }
      wasInProgress = now;
    } catch (e) {
      showBanner("管理ツールへの接続に失敗しました: " + e.message, "crit");
    }
  }

  paintAnnounce();
  loadTrends().then(tick);
  loadHistory();
  loadNext();
  loadFeed();

  state.refresher = setInterval(tick, 1000);
  // 傾向・予定・アクティビティは1秒ごとに取り直す必要がない。
  // ここを速くするとゲームサーバではなく管理ツール側の負荷になる
  state.timers.push(setInterval(() => { loadTrends(); loadNext(); loadFeed(); }, 30000));
}

// --------------------------------------------------------------------------
// プレイヤー管理
// --------------------------------------------------------------------------
function renderPlayers(root) {
  const lead = el("div", { class: "lead" });
  const search = el("input", { type: "text", placeholder: "名前 / UserID で絞り込み", style: "width:260px" });
  const wrap = el("div", { class: "pcards" });
  const eventsBox = el("div");

  root.appendChild(el("div", { class: "pagehead" }, [
    el("div", null, [el("h1", { text: "プレイヤー" }), lead]),
    el("div", { class: "right" }, [
      search,
      el("button", { class: "btn", text: "更新", onclick: () => load() }),
    ]),
  ]));
  const note = readOnlyNote("プレイヤーのキック・BAN にはログインが必要です。一覧の閲覧はできます。");
  if (note) root.appendChild(note);
  root.appendChild(wrap);
  root.appendChild(eventsBox);

  search.addEventListener("input", () => paint());
  let players = [];

  function act(kind, player) {
    const label = kind === "kick" ? "キック" : "BAN";
    const reason = el("input", { type: "text", placeholder: "例: 迷惑行為" });
    openModal({
      title: `${player.name} を${label}します`,
      lead: kind === "ban"
        ? "BAN したプレイヤーは再接続できなくなります。解除はプレイヤー一覧からは行えません。"
        : "キックされたプレイヤーは再接続できます。",
      danger: true,
      confirmLabel: label + "する",
      body: [
        el("div", { class: "infobox" }, [
          el("div", { text: "UserID: " + player.userId }),
          el("div", { class: "muted small", text: "Lv" + player.level + " / Ping " + player.ping }),
        ]),
        el("div", { class: "field" }, [el("label", { text: "理由" }), reason]),
      ],
      async onConfirm() {
        await post("/api/players/" + kind, { userid: player.userId, message: reason.value });
        toast(`${player.name} を${label}しました`, "ok");
        load();
      },
    });
  }

  // UserID は長いので、頭と尻だけ見せる。突き合わせにはこれで足りる
  function shortId(id) {
    const s = String(id || "");
    return s.length > 18 ? s.slice(0, 10) + "…" + s.slice(-4) : s;
  }

  function playerCard(p) {
    const initial = (p.name || "?").trim().charAt(0).toUpperCase();
    return el("div", { class: "pcard" }, [
      el("div", { class: "who" }, [
        el("div", { class: "avatar", text: initial }),
        el("div", { style: "min-width:0" }, [
          el("div", { class: "pname", text: p.name }),
          el("div", { class: "pid", text: shortId(p.userId) }),
        ]),
        el("span", { class: "tag-online", text: "接続中" }),
      ]),
      el("div", { class: "stats" }, [
        el("div", { class: "stat" }, [
          el("div", { class: "k", text: "Lv" }), el("div", { class: "v", text: p.level }),
        ]),
        el("div", { class: "stat" }, [
          el("div", { class: "k", text: "Ping" }),
          el("div", { class: "v" + (p.ping >= 150 ? " " : ""), style: p.ping >= 150 ? "color:var(--warn)" : "",
            text: p.ping }),
        ]),
        el("div", { class: "stat" }, [
          el("div", { class: "k", text: "滞在" }),
          el("div", { class: "v", text: p.stay_seconds === null || p.stay_seconds === undefined
            ? "-" : fmtDuration(p.stay_seconds) }),
        ]),
      ]),
      el("div", { class: "pid" }, [
        "座標 " + Math.round(p.location_x) + ", " + Math.round(p.location_y),
        p.building_count !== undefined ? "　建築 " + p.building_count : null,
      ]),
      el("div", { class: "row" }, [
        gate(el("button", { class: "btn small", text: "キック", onclick: () => act("kick", p) })),
        gate(el("button", { class: "btn small danger", text: "BAN", onclick: () => act("ban", p) })),
      ]),
    ]);
  }

  function paint() {
    const q = search.value.trim().toLowerCase();
    const shown = players.filter(p =>
      !q || String(p.name || "").toLowerCase().includes(q)
         || String(p.userId || "").toLowerCase().includes(q));

    clear(wrap);
    if (!shown.length) {
      wrap.appendChild(el("div", { class: "panel muted",
        text: players.length ? "該当するプレイヤーがいません" : "接続中のプレイヤーはいません" }));
      return;
    }
    for (const p of shown) wrap.appendChild(playerCard(p));
  }

  async function loadEvents() {
    let data;
    try { data = await api("/api/players/events?limit=15"); }
    catch (e) { return; }

    clear(eventsBox);
    eventsBox.appendChild(el("h2", { text: "最近の入退室" }));
    if (!data.events.length) {
      eventsBox.appendChild(el("div", { class: "panel muted",
        text: "まだ記録がありません。管理ツールが見ている間の出入りだけが残ります。" }));
      return;
    }
    const list = el("div", { class: "timeline" });
    for (const e of data.events) {
      list.appendChild(el("div", { class: "ev" }, [
        el("span", { class: "at", text: fmtTs(e.ts).split(" ")[1] || fmtTs(e.ts) }),
        el("span", { class: "kind " + e.kind, text: e.kind === "join" ? "JOIN" : "LEFT" }),
        el("span", { class: "subj", text: e.name }),
        e.stay_seconds !== null && e.stay_seconds !== undefined
          ? el("span", { class: "note", text: "滞在 " + fmtDuration(e.stay_seconds) }) : null,
      ]));
    }
    eventsBox.appendChild(el("div", { class: "panel" }, [
      list,
      el("div", { class: "muted small", style: "margin-top:14px" },
        `${Math.round(data.poll_interval)}秒ごとの観測から作っています。`
        + "これより短い出入りは記録されません（REST API に入退室の通知が無いため）。"),
    ]));
  }

  async function load() {
    let data;
    try { data = await api("/api/players"); }
    catch (e) { lead.textContent = "取得に失敗しました: " + e.message; return; }

    players = data.players;
    const max = state.status && state.status.metrics ? state.status.metrics.maxplayernum : null;
    lead.textContent = "接続中 " + data.count + "人" + (max ? " ／ 最大 " + max + "人" : "");
    paint();
    loadEvents();
  }

  load();
  state.refresher = setInterval(load, 5000);
}

// --------------------------------------------------------------------------
// ワールド（プレイヤー座標のマップ）
// --------------------------------------------------------------------------
function renderWorld(root) {
  const canvas = el("canvas", { class: "worldmap", width: 900, height: 560 });
  const alerts = el("div");
  const saveBox = el("div");
  const positions = el("div");

  root.appendChild(el("div", { class: "pagehead" }, [
    el("div", null, [
      el("h1", { text: "ワールド" }),
      el("div", { class: "lead",
        text: "REST API が座標を返すのは接続中プレイヤーのみです（パル/NPCは非公開）。" }),
    ]),
  ]));

  // 左に地図、右にセーブ情報。狭い画面では縦に積む
  root.appendChild(el("div", { class: "chartgrid", style: "grid-template-columns:minmax(0,2fr) minmax(260px,1fr)" }, [
    el("div", null, [
      el("div", { class: "panel", style: "padding:16px" }, canvas),
      el("h2", { text: "異常検知" }),
      alerts,
    ]),
    el("div", null, [positions, saveBox]),
  ]));

  const RANGE = 200000; // ワールド座標のおおよその表示範囲

  function draw(points) {
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#0a1928"; ctx.fillRect(0, 0, w, h);

    // 56px 間隔の方眼。デザインの背景に合わせている
    ctx.strokeStyle = "#12293d"; ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 56) {
      ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += 56) {
      ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(w, y + .5); ctx.stroke();
    }
    const toX = (x) => (x + RANGE) / (RANGE * 2) * w;
    const toY = (y) => h - (y + RANGE) / (RANGE * 2) * h;

    for (const p of points) {
      if (p.x === null || p.y === null) continue;
      const cx = Math.max(10, Math.min(w - 10, toX(p.x)));
      const cy = Math.max(10, Math.min(h - 10, toY(p.y)));
      const color = markerColor(p);
      // 光輪 → 点 の順に描くと、点が輪に埋もれない
      ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI * 2);
      ctx.fillStyle = color + "38"; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();

      const label = p.name + " (Lv" + p.level + ")";
      ctx.font = "600 12px 'Zen Maru Gothic', system-ui";
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = "#12293d";
      roundRect(ctx, cx + 11, cy - 10, tw + 14, 20, 6);
      ctx.fill();
      ctx.strokeStyle = "#23415c"; ctx.stroke();
      ctx.fillStyle = "#e9f1f7";
      ctx.fillText(label, cx + 18, cy + 4);
    }
    if (!points.length) {
      ctx.fillStyle = "#54789a"; ctx.font = "14px 'Zen Maru Gothic', system-ui";
      ctx.fillText("接続中のプレイヤーはいません", 20, 32);
    }
  }

  // 名前ごとに色を散らす。誰がどの点かを地図と一覧で対応させるため
  const MARKERS = ["#4cc2ff", "#ffc44d", "#7ee7b4", "#c9a0ff", "#ff9d7a"];
  function markerColor(p) {
    if (p.ping >= 150) return "#ffc44d";
    let n = 0;
    for (const ch of String(p.userId || p.name || "")) n = (n + ch.charCodeAt(0)) % 997;
    return MARKERS[n % MARKERS.length];
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function paintPositions(points) {
    clear(positions);
    positions.appendChild(el("h2", { style: "margin-top:0", text: "接続中の位置" }));
    if (!points.length) {
      positions.appendChild(el("div", { class: "panel muted", text: "接続中のプレイヤーはいません" }));
      return;
    }
    positions.appendChild(el("div", { class: "panel" },
      points.map(p => el("div", { class: "row", style: "gap:10px;flex-wrap:nowrap;margin-bottom:10px" }, [
        el("span", { class: "statusdot", style: "background:" + markerColor(p) + ";box-shadow:none" }),
        el("span", { style: "flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap",
          text: p.name }),
        el("span", { class: "mono small muted",
          text: Math.round(p.x) + ", " + Math.round(p.y) }),
      ]))));
  }

  // --- ワールドセーブとバックアップ ---
  async function loadSave() {
    let data;
    try { data = await api("/api/world/backups"); }
    catch (e) { return; }

    clear(saveBox);
    saveBox.appendChild(el("h2", { text: "ワールドセーブ" }));

    const rows = el("div", { class: "mono small muted", style: "line-height:2" }, [
      el("div", { text: "最終更新 " + (data.last_saved_at ? fmtTime(data.last_saved_at) : "-") }),
      el("div", { text: "サイズ " + fmtBytes(data.size) + (data.files ? "（" + data.files + " ファイル）" : "") }),
      el("div", { text: "保持 " + data.keep + " 世代" }),
    ]);

    const actions = el("div", { class: "row", style: "margin-top:14px" }, [
      gate(el("button", {
        class: "btn primary", text: "いまバックアップ",
        onclick: () => openModal({
          title: "ワールドをバックアップします",
          lead: data.server_running
            ? "先にワールド保存を実行してから固めます。"
            : "サーバが停止しているので、そのまま固めます。",
          confirmLabel: "バックアップする",
          body: data.server_running ? [
            el("div", { class: "warnbox" },
              "稼働中のセーブは書き込みの途中にあたる可能性があります。"
              + "確実に取りたい場合はサーバを停止してから実行してください。"),
          ] : [],
          async onConfirm() {
            const r = await post("/api/world/backups");
            toast("バックアップしました（" + fmtBytes(r.backup.size) + "）", "ok");
            loadSave();
          },
        }),
      })),
    ]);

    saveBox.appendChild(el("div", { class: "panel" }, [
      data.exists ? rows : el("div", { class: "muted small",
        text: "セーブディレクトリが見つかりません: " + data.path }),
      actions,
    ]));

    saveBox.appendChild(el("h2", { text: "バックアップ（" + data.backups.length + "）" }));
    if (!data.backups.length) {
      saveBox.appendChild(el("div", { class: "panel muted", text: "まだバックアップはありません" }));
      return;
    }
    const list = el("div", { class: "panel", style: "padding:14px" });
    for (const b of data.backups) {
      list.appendChild(el("div", { style: "padding:10px 0;border-bottom:1px solid var(--line)" }, [
        el("div", { class: "mono small", text: fmtTime(b.created_at) }),
        el("div", { class: "muted small", text: fmtBytes(b.size) }),
        el("div", { class: "row", style: "margin-top:8px" }, [
          gate(el("button", {
            class: "btn small", text: "ダウンロード",
            onclick: () => { window.location.href = "/api/world/backups/" + encodeURIComponent(b.name) + "/download"; },
          })),
          gate(el("button", {
            class: "btn small danger", text: "復元",
            onclick: () => openModal({
              title: "ワールドを復元します",
              lead: b.name + " の内容でセーブを置き換えます。",
              danger: true,
              confirmLabel: "復元する",
              body: [
                el("div", { class: "warnbox" },
                  data.server_running
                    ? "サーバが稼働中です。復元はサーバ停止中にしか行えません（稼働中に差し替えても、"
                      + "サーバが持っている状態で上書きされて失われます）。"
                    : "いまのセーブは失われます。復元前の状態は自動で退避しますが、"
                      + "念のため先にバックアップを取ることをおすすめします。"),
              ],
              async onConfirm() {
                await post("/api/world/backups/" + encodeURIComponent(b.name) + "/restore");
                toast("復元しました。サーバを起動すると反映されます", "ok");
                loadSave();
              },
            }),
          })),
          gate(el("button", {
            class: "btn small ghost", text: "削除",
            onclick: () => openModal({
              title: "バックアップを削除します",
              lead: b.name,
              danger: true,
              confirmLabel: "削除する",
              async onConfirm() {
                await del("/api/world/backups/" + encodeURIComponent(b.name));
                toast("削除しました", "ok");
                loadSave();
              },
            }),
          })),
        ]),
      ]));
    }
    saveBox.appendChild(list);
  }

  async function load() {
    try {
      const data = await api("/api/world");
      draw(data.points);
      paintPositions(data.points);
      clear(alerts);
      if (!data.anomalies.length) {
        alerts.appendChild(el("div", { class: "panel muted", text: "異常はありません" }));
      }
      for (const a of data.anomalies) {
        const label = a.type === "high_ping" ? "Pingが高い" : a.type === "many_buildings" ? "建築数が多い" : a.type;
        alerts.appendChild(el("div", { class: "panel", style: "margin-bottom:10px" }, [
          el("strong", { text: a.name }),
          el("span", { class: "muted", text: " — " + label + ": " + a.value }),
        ]));
      }
    } catch (e) { toast(e.message, "err"); }
  }
  load();
  loadSave();
  state.refresher = setInterval(load, 5000);
}

// --------------------------------------------------------------------------
// 稼働履歴
// --------------------------------------------------------------------------
function renderHistory(root) {
  // 期間はピルで切り替える。1時間より長い範囲は記録が残っていれば出る
  const PERIODS = [
    { minutes: 60, label: "1時間" },
    { minutes: 360, label: "6時間" },
    { minutes: 1440, label: "24時間" },
    { minutes: 10080, label: "7日" },
  ];
  let minutes = 60;

  const lead = el("div", { class: "lead" });
  const pills = el("div", { class: "chips" });
  root.appendChild(el("div", { class: "pagehead" }, [
    el("div", null, [el("h1", { text: "稼働履歴" }), lead]),
    el("div", { class: "right" }, [
      pills,
      gate(el("button", {
        class: "btn small", text: "今すぐ1点記録",
        onclick: async () => { await post("/api/sample"); load(); },
      })),
    ]),
  ]));

  function paintPills() {
    clear(pills);
    for (const p of PERIODS) {
      pills.appendChild(el("button", {
        class: "chip" + (p.minutes === minutes ? " on" : ""),
        text: p.label,
        onclick: () => { minutes = p.minutes; paintPills(); load(); },
      }));
    }
  }
  paintPills();

  const charts = [
    { key: "fps", label: "サーバFPS", color: "#4cc2ff", unit: "" },
    { key: "players", label: "プレイヤー数", color: "#7ee7b4", unit: "" },
    { key: "mem_percent", label: "メモリ使用率", color: "#ffc44d", unit: "%" },
    { key: "cpu_percent", label: "CPU使用率", color: "#5b86a8", unit: "%" },
  ];
  const grid = el("div", { class: "chartgrid" });
  for (const c of charts) {
    c.head = el("div", { class: "charthead" });
    // 高さ比は CSS で持つ。インライン style だとメディアクエリで上書きできない
    c.canvas = el("canvas", { class: "chart", width: 900, height: 200 });
    c.axis = el("div", { class: "axis" });
    grid.appendChild(el("div", { class: "panel" }, [c.head, c.canvas, c.axis]));
  }
  root.appendChild(grid);
  const empty = el("div", { class: "muted small", style: "margin-top:14px" });
  root.appendChild(empty);

  function paintHead(c, records) {
    const values = records.map(r => r[c.key]).filter(v => typeof v === "number");
    clear(c.head);
    clear(c.axis);
    const last = values.length ? values[values.length - 1] : null;
    const avg = values.length ? values.reduce((a, b) => a + b, 0) / values.length : null;
    const min = values.length ? Math.min.apply(null, values) : null;

    c.head.appendChild(el("span", { class: "t", text: c.label }));
    if (avg !== null) {
      c.head.appendChild(el("span", { class: "sub",
        text: "平均 " + avg.toFixed(1) + c.unit + " / 最低 " + min.toFixed(1) + c.unit }));
    }
    c.head.appendChild(el("span", { class: "now", style: "color:" + c.color,
      text: last === null ? "-" : last.toFixed(c.unit === "%" ? 1 : 0) + c.unit }));

    if (records.length) {
      c.axis.appendChild(el("span", { text: fmtClock(records[0].ts) }));
      c.axis.appendChild(el("span", { text: fmtClock(records[records.length - 1].ts) }));
    }
  }

  function plot(canvas, records, key, color) {
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height, pad = 10;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#0a1928"; ctx.fillRect(0, 0, w, h);

    // 目安の横罫。値は軸ラベルではなくカード見出しの数値で読ませる
    ctx.strokeStyle = "#16293c"; ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      const y = Math.round(h * i / 4) + .5;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    const values = records.map(r => r[key]).filter(v => typeof v === "number");
    if (values.length < 2) {
      ctx.fillStyle = "#54789a"; ctx.font = "13px 'Zen Maru Gothic', system-ui";
      ctx.fillText("データが足りません", 14, h / 2);
      return;
    }
    const max = Math.max.apply(null, values) * 1.15 || 1;
    const t0 = records[0].ts, t1 = records[records.length - 1].ts || t0 + 1;
    const toX = (ts) => (ts - t0) / Math.max(1, t1 - t0) * w;
    const toY = (v) => h - pad - (v / max) * (h - pad * 2);

    // 線の下を薄く塗ると、値の大小が形で分かる
    const pts = records.filter(r => typeof r[key] === "number");
    ctx.beginPath();
    ctx.moveTo(toX(pts[0].ts), h);
    for (const r of pts) ctx.lineTo(toX(r.ts), toY(r[key]));
    ctx.lineTo(toX(pts[pts.length - 1].ts), h);
    ctx.closePath();
    ctx.fillStyle = color + "22"; ctx.fill();

    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.beginPath();
    pts.forEach((r, i) => {
      const x = toX(r.ts), y = toY(r[key]);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
  }

  async function load() {
    try {
      const data = await api("/api/history?minutes=" + minutes);
      lead.textContent = data.records.length
        ? data.records.length + " 件 ／ " + data.interval + "秒ごとに記録"
        : "まだ記録がありません";
      empty.textContent = data.records.length
        ? ""
        : "監視ループが " + data.interval + " 秒ごとに記録します。しばらく待つか「今すぐ1点記録」を押してください。";
      for (const c of charts) {
        plot(c.canvas, data.records, c.key, c.color);
        paintHead(c, data.records);
      }
    } catch (e) { toast(e.message, "err"); }
  }
  load();
  state.refresher = setInterval(load, 30000);
}
