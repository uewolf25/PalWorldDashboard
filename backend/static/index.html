<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<title>Palworld Server Manager</title>
<style>
/* ==========================================================================
   デザイントークン（Issue #19）

   claude.ai/design の「Palworldサーバーダッシュボード」から取り込んだ配色。
   紺を土台に、行動を促す色だけを絞って使う。
   ========================================================================== */
:root {
  --bg: #0a1420;          /* 画面の地 */
  --panel: #0d1b2a;       /* サイドバー・上部バー */
  --card: #0f2436;        /* カード・パネル */
  --sunken: #0a1928;      /* 入力欄・カード内のくぼみ */
  --ink: #08111c;         /* ログのような「奥」の面 */

  --line: #16293c;        /* 仕切り線 */
  --line2: #1a3550;       /* カードの縁 */
  --line3: #23415c;       /* 入力欄の縁 */

  --fg: #e9f1f7;
  --fg2: #cfe2f0;
  --muted: #8fabc4;
  --muted2: #6f8ea8;

  --accent: #4cc2ff;
  --accent-ink: #06253a;  /* アクセント面に乗せる文字 */
  --accent-dim: #12354f;  /* タグの下地 */
  --accent-deep: #1c4f74; /* 選択中のピル */

  --ok: #7ee7b4;
  --ok-dim: #12352a;
  --warn: #ffc44d;
  --warn-dim: #3a2c12;
  --crit: #ff8fa3;
  --crit-line: #5b3040;
  --crit-dim: #2a1620;

  --radius: 18px;         /* カード */
  --radius-sm: 12px;      /* ボタン・入力欄 */
  --radius-xs: 10px;      /* カード内の小さな面 */

  --mono: 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: 'Zen Maru Gothic', system-ui, -apple-system,
               "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  font-size: 14px; font-weight: 500; line-height: 1.7;
  /* iOS は横向きにすると本文を勝手に拡大する。表の桁が崩れるので止める */
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
.layout { display: flex; min-height: 100vh; }

/* --- サイドバー --- */
.sidebar {
  width: 224px; flex: 0 0 224px; background: var(--panel);
  border-right: 1px solid var(--line); padding: 24px 14px;
  display: flex; flex-direction: column; gap: 4px;
}
.brand {
  font-size: 16px; font-weight: 900; color: #fff;
  padding: 0 8px 4px; display: flex; flex-direction: column;
  align-items: flex-start; gap: 10px;
}
.badge {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 999px;
  background: var(--accent-dim); color: #67c7f5;
}
.badge.production { background: #40202a; color: #ff8f8f; }
.navgroup { display: flex; flex-direction: column; gap: 4px; margin-top: 22px; }
.navsep { height: 1px; background: var(--line); margin: 10px 14px; }
.navbtn {
  background: none; border: 0; text-align: left; padding: 11px 14px;
  border-radius: var(--radius-sm); cursor: pointer; color: var(--muted);
  font-size: 14px; font-weight: 500;
}
.navbtn:hover { background: var(--card); color: var(--fg); }
.navbtn.active {
  background: linear-gradient(90deg, var(--accent-deep), #143b58);
  color: #fff; font-weight: 700; box-shadow: 0 2px 10px rgba(28,79,116,.5);
}
.sidebar .spacer { flex: 1; }
.sidefoot {
  margin-top: auto; padding: 14px; border-radius: 14px; background: var(--card);
  display: flex; flex-direction: column; gap: 8px;
}
.sidefoot .who { font-size: 12px; color: var(--muted); }
.sidefoot .act {
  font-size: 13px; font-weight: 700; cursor: pointer;
  background: none; border: 0; padding: 0; text-align: left;
}
.sidefoot .act.out { color: #f2a25c; }
.sidefoot .act.in { color: var(--accent); }
.statusdot {
  display: inline-block; width: 9px; height: 9px; border-radius: 50%;
  background: var(--muted2); flex: none;
}
.statusdot.online { background: #5ddba4; box-shadow: 0 0 12px rgba(93,219,164,.7); }
.statusdot.offline { background: var(--crit); box-shadow: 0 0 12px rgba(255,143,163,.5); }

/* --- 上部バー（常時表示。サーバの状態と主要操作） --- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 16px 30px; background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
  padding-top: max(16px, env(safe-area-inset-top));
  padding-left: max(30px, env(safe-area-inset-left));
  padding-right: max(30px, env(safe-area-inset-right));
}
.topbar .servername { display: flex; align-items: center; gap: 11px; font-size: 16px; font-weight: 700; }
.topbar .facts {
  display: flex; align-items: center; gap: 14px;
  font-family: var(--mono); font-size: 12px; color: var(--muted);
}
.topbar .facts .sep { color: #2b4a66; }
.topbar .actions { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
.hamburger {
  display: none; background: var(--card); border: 1px solid var(--line3);
  border-radius: var(--radius-sm); padding: 8px 12px; cursor: pointer;
}
.view {
  padding: 28px 30px 60px;
  padding-left: max(30px, env(safe-area-inset-left));
  padding-right: max(30px, env(safe-area-inset-right));
}

h1 { font-size: 24px; font-weight: 900; margin: 0; }
h2 { font-size: 15px; font-weight: 700; margin: 26px 0 12px; color: var(--fg); }
.pagehead { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.pagehead .lead { font-size: 13px; color: var(--muted); margin-top: 6px; }
.pagehead .lead.mono { font-family: var(--mono); font-size: 12px; }
.pagehead .right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* --- カード --- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.card {
  background: var(--card); border: 1px solid var(--line2);
  border-radius: var(--radius); padding: 18px;
}
.card .label { color: var(--muted); font-size: 12px; }
.card .value {
  font-family: var(--mono); font-size: 26px; font-weight: 700;
  margin-top: 6px; font-variant-numeric: tabular-nums;
}
.card .sub { color: var(--muted2); font-size: 12px; }
.value.warn { color: var(--warn); } .value.crit { color: var(--crit); } .value.ok { color: var(--ok); }
.panel {
  background: var(--card); border: 1px solid var(--line2);
  border-radius: var(--radius); padding: 22px;
}

/* --- 表 --- */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid #142a3d; }
th {
  color: var(--muted2); font-weight: 500; font-size: 11px;
  font-family: var(--mono); border-bottom: 1px solid var(--line);
}
td { font-size: 13px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: rgba(23,51,75,.45); }
.tablewrap {
  background: var(--card); border: 1px solid var(--line2);
  border-radius: var(--radius); overflow-x: auto;
}
.mono { font-family: var(--mono); }

/* --- ボタン --- */
button.btn {
  font-size: 13px; font-weight: 700; padding: 10px 18px;
  border-radius: var(--radius-sm); border: 1px solid var(--line3);
  background: #12293d; color: var(--fg2); cursor: pointer; white-space: nowrap;
}
button.btn:hover { border-color: var(--accent); color: #fff; }
button.btn.primary {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  box-shadow: 0 3px 12px rgba(76,194,255,.3);
}
button.btn.primary:hover { background: #6ccdff; }
button.btn.danger { border-color: var(--crit-line); background: var(--crit-dim); color: var(--crit); }
button.btn.danger:hover { background: #3a1f28; border-color: var(--crit); }
button.btn.solid-danger {
  background: #e5566e; border-color: #e5566e; color: #2a0d0d; box-shadow: none;
}
button.btn.solid-danger:hover { background: #ff6b83; }
button.btn.small { font-size: 12px; padding: 8px 14px; border-radius: var(--radius-xs); }
button.btn.ghost { background: transparent; }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
button.btn:disabled:hover { border-color: var(--line3); color: var(--fg2); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* --- 入力欄 --- */
input[type=text], input[type=number], input[type=date], input[type=time],
input[type=password], select, textarea {
  background: var(--sunken); border: 1px solid var(--line3);
  border-radius: var(--radius-sm); padding: 11px 14px; color: var(--fg);
}
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(76,194,255,.45); outline-offset: -1px; }
input::placeholder { color: #5f7d97; }
textarea {
  width: 100%; min-height: 320px; font-family: var(--mono);
  font-size: 12.5px; line-height: 1.9; white-space: pre; background: var(--sunken);
}
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* --- モーダル --- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(4,10,18,.72); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(3px);
}
.modal {
  background: var(--card); border: 1px solid var(--line2); border-radius: var(--radius);
  width: 100%; max-width: 540px; display: flex; flex-direction: column;
  box-shadow: 0 24px 60px rgba(0,0,0,.55);
  max-height: 88vh; max-height: 88dvh;
}
.modal-head { padding: 20px 22px 12px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; font-size: 17px; font-weight: 900; }
.modal-head .lead { color: var(--muted); font-size: 13px; margin-top: 6px; }
.modal-body { padding: 18px 22px; overflow-y: auto; }
.modal-foot {
  padding: 14px 22px 20px; display: flex; gap: 10px;
  justify-content: flex-end; border-top: 1px solid var(--line);
}
.modal .field { margin-bottom: 16px; }
.modal .field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.modal .field input[type=text], .modal .field select { width: 100%; }
.modal .error { color: var(--crit); font-size: 12.5px; min-height: 1.2em; }
.warnbox {
  background: linear-gradient(135deg, #2c2412, #1a2333);
  border: 1px solid #4a3a1a; border-radius: var(--radius-sm);
  padding: 14px 16px; font-size: 13px; color: #ffd98a;
}
.infobox {
  background: var(--sunken); border: 1px solid var(--line3);
  border-radius: var(--radius-sm); padding: 14px 16px; font-size: 13px;
}
.modal .warnbox, .modal .infobox { margin-bottom: 16px; }
.warnbox.small { font-size: 12px; padding: 10px 12px; }

/* --- ゲーム設定フォーム --- */
.catbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.catbtn {
  border: 1px solid var(--line3); background: #12293d; border-radius: 999px;
  padding: 9px 16px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted);
}
.catbtn:hover { color: var(--fg); }
.catbtn.on { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }
.catbtn .count { opacity: .75; margin-left: 6px; font-family: var(--mono); font-size: 11px; }

.fieldgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.setting {
  background: var(--card); border: 1px solid var(--line2); border-radius: var(--radius);
  padding: 20px; display: flex; flex-direction: column; gap: 8px;
}
.setting.changed { border-color: #2f5a7d; box-shadow: 0 0 0 1px rgba(76,194,255,.18); }
.setting .head { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.setting .head > div { min-width: 0; }
.setting .title { font-size: 14px; font-weight: 700; }
.setting .name {
  font-family: var(--mono); font-size: 11px; color: var(--muted2);
  overflow-wrap: anywhere;
}
.setting .help { font-size: 12px; color: var(--muted); line-height: 1.8; }
.setting input, .setting select { width: 100%; }
.setting .ctl { display: flex; gap: 8px; align-items: center; }
.setting .ctl button { flex: 0 0 auto; }
.setting.muted-card { border-style: dashed; opacity: .85; }
.setting.muted-card .title { font-weight: 500; }
.tag-unknown, .tag-changed, .tag-added, .tag-locked {
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap;
}
.tag-unknown { background: var(--warn-dim); color: var(--warn); }
.tag-changed { background: var(--accent-dim); color: #7fd1ff; }
.tag-added { background: var(--ok-dim); color: var(--ok); }
.tag-locked { background: var(--crit-dim); color: var(--crit); border: 1px solid var(--crit-line); }

.savebar {
  position: sticky; bottom: 0; margin-top: 18px; z-index: 10;
  background: rgba(13,27,42,.94); border: 1px solid var(--line3);
  border-radius: var(--radius); padding: 16px 20px;
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  box-shadow: 0 -6px 24px rgba(0,0,0,.45); backdrop-filter: blur(8px);
}
.difflist { max-height: 40vh; max-height: 40dvh; overflow-y: auto; }
.difflist .row2 {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px;
}
.difflist .before { color: var(--muted2); text-decoration: line-through; }
.difflist .after { color: var(--ok); font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line3); background: #12293d; border-radius: 999px;
  padding: 8px 15px; cursor: pointer; font-size: 13px; font-weight: 700;
  color: var(--muted); user-select: none;
}
.chip.on { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }

/* --- プレイヤーカード --- */
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.pcard {
  background: var(--card); border: 1px solid var(--line2); border-radius: var(--radius);
  padding: 20px; display: flex; flex-direction: column; gap: 14px;
}
.pcard .who { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 42px; height: 42px; flex: none; border-radius: var(--radius-sm);
  background: #17334b; display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 16px; color: #7fd1ff;
}
.pcard .pname {
  font-size: 15px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pcard .pid { font-family: var(--mono); font-size: 11px; color: var(--muted2); }
.tag-online {
  margin-left: auto; font-size: 11px; font-weight: 700;
  color: var(--ok); background: var(--ok-dim); border-radius: 6px; padding: 4px 8px;
}
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--sunken); border-radius: var(--radius-xs); padding: 10px 12px; min-width: 0; }
.stat .k { font-size: 10px; color: var(--muted2); margin-bottom: 4px; }
.stat .v {
  font-family: var(--mono); font-size: 16px; font-weight: 700;
  overflow: hidden; text-overflow: ellipsis;
}

/* --- ダッシュボードの指標カード --- */
.statcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.statcard {
  background: var(--card); border: 1px solid var(--line2);
  border-radius: var(--radius); padding: 20px; min-width: 0;
}
.statcard .k { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.statcard .v {
  font-family: var(--mono); font-size: 32px; font-weight: 700; color: #fff;
  line-height: 1.2; font-variant-numeric: tabular-nums;
}
.statcard .v .unit { font-size: 18px; color: var(--muted2); }
.statcard .foot { font-family: var(--mono); font-size: 11px; color: var(--muted2); margin-top: 8px; }
.statcard .state { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 900; }
/* スパークライン。値の読みは大きい数字に任せ、ここは形だけ見せる */
.statcard svg.spark { width: 100%; height: 26px; margin-top: 14px; display: block; }
/* 使用率のバー */
.meter { height: 6px; border-radius: 4px; background: #1c3a55; margin-top: 14px; overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; }
/* 人数のセグメント。max に対する割合を段階で見せる */
.segbar { display: flex; gap: 4px; margin-top: 14px; }
.segbar > span { flex: 1; height: 5px; border-radius: 3px; background: #1c3a55; }
.segbar > span.on { background: var(--accent); }

/* --- ダッシュボードの2段組 --- */
.dashgrid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 22px; align-items: start; margin-top: 22px; }
.dashcol { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.cardhead { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.cardhead .t { font-size: 15px; font-weight: 700; }
.cardhead .more {
  margin-left: auto; font-size: 12px; font-weight: 700; color: var(--accent);
  background: none; border: 0; cursor: pointer; padding: 0;
}
.counter { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted2); }
.counter.over { color: var(--crit); }
/* 送信先の表示。押せるものと押せないものを見た目で分ける */
.targets { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; }
.target { display: flex; align-items: center; gap: 7px; color: var(--muted); }
.target .lamp { width: 9px; height: 9px; border-radius: 50%; background: #1c3a55; }
.target.on { color: var(--fg2); }
.target.on .lamp { background: var(--ok); }
.target.tap { cursor: pointer; }
.targets .note { margin-left: auto; font-size: 12px; color: var(--muted2); }

/* --- 直近のアクティビティ --- */
.feed { display: flex; flex-direction: column; gap: 10px; font-family: var(--mono); font-size: 12px; }
.feed .it { display: grid; grid-template-columns: 62px 56px 1fr; gap: 10px; align-items: baseline; }
.feed .at { color: #5b7d99; }
.feed .tag { font-weight: 700; font-size: 11px; }
.feed .msg { color: #bcd3e5; overflow-wrap: anywhere; }

/* --- 次回の予定 --- */
.nextcard { background: linear-gradient(160deg, #153854, #102a3f); border-color: #21455f; }
.nextcard .when { font-family: var(--mono); font-size: 22px; font-weight: 700; color: #fff; }
.upcoming { display: flex; flex-direction: column; gap: 10px; font-size: 12px; }
.upcoming .it { display: flex; align-items: center; gap: 10px; }
.upcoming .at { font-family: var(--mono); color: var(--fg2); }
.upcoming .rel { margin-left: auto; font-family: var(--mono); color: var(--muted2); }

/* --- 入退室・タイムライン --- */
.timeline { display: flex; flex-direction: column; gap: 12px; font-family: var(--mono); font-size: 12px; }
.timeline .ev { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
.timeline .at { color: var(--muted2); }
.timeline .kind { font-weight: 700; }
.timeline .kind.join { color: var(--ok); }
.timeline .kind.leave { color: var(--crit); }
.timeline .subj { color: var(--fg2); }
.timeline .note { color: var(--muted2); }

/* --- 稼働履歴 --- */
.charthead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.charthead .t { font-size: 15px; font-weight: 700; }
.charthead .sub { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.charthead .now { margin-left: auto; font-family: var(--mono); font-size: 20px; font-weight: 700; }
.chartgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.axis {
  display: flex; justify-content: space-between; margin-top: 8px;
  font-family: var(--mono); font-size: 11px; color: var(--muted2);
}

/* --- ログ --- */
#log {
  background: var(--ink); border: 1px solid var(--line2); border-radius: var(--radius);
  padding: 20px 22px; height: 60vh; height: 60dvh; overflow-y: auto;
  font-family: var(--mono); font-size: 12.5px; line-height: 2.05;
}
#log .ln { display: grid; grid-template-columns: 82px 62px 1fr; gap: 14px; }
#log .lt { color: #5b7d99; }
#log .lv { font-weight: 700; }
#log .lv.info { color: var(--muted); }
#log .lv.warn { color: var(--warn); }
#log .lv.error { color: var(--crit); }
#log .lm { color: #bcd3e5; overflow-wrap: anywhere; white-space: pre-wrap; }
#log .lm.app { color: #9fd0f0; }

/* --- 通知・バナー --- */
#toast {
  position: fixed; z-index: 200; display: flex; flex-direction: column; gap: 10px;
  right: max(16px, env(safe-area-inset-right));
  bottom: calc(16px + env(safe-area-inset-bottom));
}
.toast {
  background: var(--card); border: 1px solid var(--line2); border-left: 3px solid var(--accent);
  padding: 12px 16px; border-radius: var(--radius-sm); max-width: 340px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
}
.toast.err { border-left-color: var(--crit); }
.toast.ok { border-left-color: var(--ok); }

.banner { border-radius: var(--radius-sm); padding: 14px 18px; margin-bottom: 18px; display: none; }
.banner.show { display: block; }
.banner.crit { background: var(--crit-dim); border: 1px solid var(--crit-line); color: #ffd6de; }
.banner.warn { background: var(--warn-dim); border: 1px solid #6d5a2f; color: #ffe6b0; }

canvas { width: 100%; background: var(--sunken); border: 1px solid var(--line2); border-radius: var(--radius-sm); }
/* 描画は 900px 幅の座標系で行い、表示側は比率だけ保って伸縮させる。
   メディアクエリで上書きできるよう、インライン style ではなくここに置く */
canvas.worldmap { aspect-ratio: 900 / 560; }
canvas.chart { aspect-ratio: 900 / 200; }

/* --- ログイン画面 --- */
.login-screen {
  display: none; position: fixed; inset: 0; z-index: 300; overflow-y: auto;
  background: radial-gradient(1200px 600px at 50% -10%, #14304a, var(--bg));
  align-items: center; justify-content: center;
  padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
           calc(20px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}
.login-screen.show { display: flex; }
.login-card {
  background: var(--card); border: 1px solid var(--line2); border-radius: var(--radius);
  padding: 34px 30px; width: 100%; max-width: 400px;
  box-shadow: 0 24px 60px rgba(0,0,0,.55);
}
.login-brand { font-size: 20px; font-weight: 900; margin-bottom: 6px; }
.login-lead { color: var(--muted); font-size: 13px; margin: 0 0 24px; line-height: 1.8; }
.login-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
#login-username, #login-password { width: 100%; }
.login-error { color: var(--crit); font-size: 12.5px; min-height: 1.4em; margin: 10px 0 4px; }
.login-submit { width: 100%; margin-top: 8px; }

.backdrop { display: none; }

/* ==========================================================================
   レスポンシブ（Issue #18）

   iPhone / iPad で詰まりやすいのは次の4つ。
     - iOS は font-size が 16px 未満の入力欄にフォーカスすると画面を勝手に拡大し、
       戻してくれない。入力欄だけ 16px にして防ぐ
     - 列の多い表は幅を詰めると折り返して読めなくなる。縮めずに横スクロールさせる
     - 指で押す前提だとボタンが小さい。ポインタが粗いときだけ大きくする
     - ノッチとホームインジケータの下にコンテンツが潜る（safe-area-inset）
   ========================================================================== */

/* --- タブレット縦（iPad 768px など）: サイドバーは出したまま幅を詰める --- */
@media (max-width: 900px) {
  .sidebar { width: 180px; flex-basis: 180px; }
  .view { padding: 20px 18px 60px; }
  .topbar { padding: 14px 18px; }
  .dashgrid { grid-template-columns: 1fr; }
  /* 250px なら iPad mini 縦（本文 528px）でも2列に収まる */
  .fieldgrid, .pcards { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .chartgrid { grid-template-columns: 1fr; }

  /* 表は詰めずに横スクロールさせる。潰すと折り返して桁が読めなくなる */
  .tablewrap { -webkit-overflow-scrolling: touch; }
  .tablewrap table { min-width: 560px; }
}

/* --- 横幅が足りない: サイドバーを引き出しにする --- */
@media (max-width: 700px) {
  .layout { display: block; }
  .hamburger { display: block; }
  .view { padding: 16px 14px 60px; }
  .topbar { padding: 12px 14px; gap: 12px; }
  .topbar .facts { width: 100%; order: 3; }
  .topbar .actions { margin-left: auto; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 40; transform: translateX(-100%);
    transition: transform .2s ease; width: 240px; flex-basis: auto;
    padding-left: max(14px, env(safe-area-inset-left));
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .sidebar.open { transform: none; }
  .backdrop.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .dashgrid { grid-template-columns: 1fr; gap: 16px; }
  .modal { max-height: 92vh; max-height: 92dvh; }
  th, td { padding: 11px 12px; }
}

/* --- スマートフォン --- */
@media (max-width: 560px) {
  h1 { font-size: 20px; }
  .view { padding: 14px 12px 48px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .card { padding: 14px; }
  .card .value { font-size: 22px; }

  /* 2列だと1項目の幅が足りず、ラベルと入力欄が潰れる */
  .fieldgrid, .pcards { grid-template-columns: 1fr; }
  .statcards { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .statcard { padding: 14px; }
  .statcard .v { font-size: 24px; }
  .feed .it { grid-template-columns: 54px 48px 1fr; gap: 8px; }

  /* 変更前 → 変更後 を横並びにすると各1/3幅になって読めない。縦に積む。
     矢印は縦並びだと意味を成さないので消す（打ち消し線と色で分かる） */
  .difflist .row2 { grid-template-columns: 1fr; gap: 2px; }
  .difflist .row2 > span { display: none; }

  /* モーダルは下から出すシート型にする。画面が狭いほど中央寄せは窮屈 */
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal { max-width: none; border-radius: var(--radius) var(--radius) 0 0; max-height: 90vh; max-height: 90dvh; }
  .modal-head { padding: 18px 16px 10px; }
  .modal-body { padding: 14px 16px; }
  .modal-foot {
    flex-direction: column-reverse; gap: 8px;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .modal-foot .btn { width: 100%; }

  /* 右下 340px 固定だと画面幅に対して大きすぎ、本文に被る */
  #toast { left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); }
  .toast { max-width: none; }

  /* 2つのボタンで1行を分け合う。ホームインジケータに被らせない */
  .savebar { padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); gap: 8px; }
  .savebar > button.btn { flex: 1 1 0; }

  .login-card { padding: 26px 20px; }
  textarea { min-height: 240px; }
  #log { height: 56vh; height: 56dvh; padding: 14px; }
  #log .ln { grid-template-columns: 66px 52px 1fr; gap: 8px; font-size: 11.5px; }

  /* 横長すぎて潰れるので、スマートフォンでは縦に伸ばす */
  canvas.chart { aspect-ratio: 900 / 380; }
  .stats { gap: 8px; }
}

/* --- 指で操作する端末 --- */
/* 画面幅ではなく入力方式で判定する。狭くしただけのデスクトップには要らない */
@media (pointer: coarse) {
  /* iOS は 16px 未満の入力欄にフォーカスすると拡大し、そのまま戻らない。
     画面から要素がはみ出し、指で縮めるしかなくなる */
  input[type=text], input[type=number], input[type=date], input[type=time],
  input[type=password], select, textarea { font-size: 16px; }

  button.btn { padding: 12px 18px; min-height: 44px; }
  button.btn.small { min-height: 38px; padding: 8px 14px; }
  .navbtn { padding: 13px 14px; }
  .catbtn, .chip { padding: 10px 16px; }
  .hamburger { min-height: 44px; min-width: 44px; }
}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="backdrop" id="backdrop"></div>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="view">
      <div class="banner" id="banner"></div>
      <div id="view"></div>
    </div>
  </main>
</div>
<div id="toast"></div>
<div id="modal-root"></div>

<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-brand">Palworld Manager</div>
    <p class="login-lead">サーバを操作するにはログインが必要です。閲覧だけならログインは要りません。</p>
    <label class="login-label" for="login-username">ログインID</label>
    <input type="text" id="login-username" autocomplete="username" autofocus>
    <label class="login-label" for="login-password" style="margin-top:14px">パスワード</label>
    <input type="password" id="login-password" autocomplete="current-password">
    <div class="login-error" id="login-error"></div>
    <button class="btn primary login-submit" id="login-submit">ログイン</button>
    <button class="btn login-submit" id="login-cancel">ログインせずに閲覧する</button>
  </div>
</div>

<script>
"use strict";

// --------------------------------------------------------------------------
// DOM ヘルパ。値は必ず textContent で入れる（サーバ名やプレイヤー名に
// タグが混ざっても実行させないため）。
// --------------------------------------------------------------------------
function el(tag, props, children) {
  const node = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
  }
  for (const child of [].concat(children || [])) {
    if (child === null || child === undefined || child === false) continue;
    node.appendChild(typeof child === "string" || typeof child === "number"
      ? document.createTextNode(String(child)) : child);
  }
  return node;
}
const $ = (id) => document.getElementById(id);
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function toast(message, kind) {
  const t = el("div", { class: "toast " + (kind || ""), text: message });
  $("toast").appendChild(t);
  setTimeout(() => t.remove(), 4500);
}

async function api(path, options) {
  const resp = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, options));
  let body = null;
  try { body = await resp.json(); } catch (e) { body = null; }
  if (!resp.ok) {
    let detail = "HTTP " + resp.status;
    if (body && body.detail) {
      detail = typeof body.detail === "string" ? body.detail
        // FastAPI のバリデーションエラーは配列で来る
        : body.detail.map(d => (d.loc ? d.loc[d.loc.length - 1] + ": " : "") + d.msg).join(" / ");
    }
    // 401 は「操作にはログインが要る」の意味。閲覧は 401 にならない。
    // ログイン済みのつもりで操作していたならセッション切れなので、ログインに戻す。
    // もともと閲覧専用で見ていた相手を、ログイン画面で足止めはしない
    if (resp.status === 401 && !path.startsWith("/api/login")) {
      const err = new Error(detail);
      err.unauthorized = true;
      if (state.config && state.config.authenticated) {
        state.config.authenticated = false;
        showLogin("セッションが切れました。もう一度ログインしてください。");
      }
      throw err;
    }
    throw new Error(detail);
  }
  return body;
}
const post = (p, b) => api(p, { method: "POST", body: JSON.stringify(b || {}) });
const put = (p, b) => api(p, { method: "PUT", body: JSON.stringify(b || {}) });
const patch = (p, b) => api(p, { method: "PATCH", body: JSON.stringify(b || {}) });
const del = (p) => api(p, { method: "DELETE" });

function fmtDuration(sec) {
  if (sec === null || sec === undefined) return "-";
  sec = Math.floor(sec);
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600),
        m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (d) return d + "日" + h + "時間";
  if (h) return h + "時間" + m + "分";
  if (m) return m + "分" + s + "秒";
  return s + "秒";
}
function fmtTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  return isNaN(d) ? String(iso) : d.toLocaleString("ja-JP", { hour12: false });
}
function fmtTs(ts) {
  return ts ? new Date(ts * 1000).toLocaleString("ja-JP", { hour12: false }) : "-";
}
function fmtClock(ts) {
  return ts ? new Date(ts * 1000).toLocaleTimeString("ja-JP", { hour12: false, hour: "2-digit", minute: "2-digit" }) : "-";
}
function fmtBytes(n) {
  if (n === null || n === undefined) return "-";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let v = Number(n), i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + " " + units[i];
}
// 秒数を「5分前」のような表示に
function offsetLabel(sec) {
  if (sec >= 60 && sec % 60 === 0) return (sec / 60) + "分前";
  if (sec >= 60) return Math.floor(sec / 60) + "分" + (sec % 60) + "秒前";
  return sec + "秒前";
}

// --------------------------------------------------------------------------
// モーダル
// --------------------------------------------------------------------------
// opts: { title, lead, body[], confirmLabel, danger, validate() -> string|null,
//         onConfirm() -> Promise }
function openModal(opts) {
  const root = $("modal-root");
  const errorBox = el("div", { class: "error" });

  const confirmBtn = el("button", {
    class: "btn " + (opts.danger ? "solid-danger" : "primary"),
    text: opts.confirmLabel || "実行",
  });
  const cancelBtn = el("button", { class: "btn", text: "キャンセル" });

  const panel = el("div", { class: "modal", role: "dialog", "aria-modal": "true" }, [
    el("div", { class: "modal-head" }, [
      el("h3", { text: opts.title }),
      opts.lead ? el("div", { class: "lead", text: opts.lead }) : null,
    ]),
    el("div", { class: "modal-body" }, [].concat(opts.body || [], [errorBox])),
    el("div", { class: "modal-foot" }, [cancelBtn, confirmBtn]),
  ]);
  const overlay = el("div", { class: "modal-overlay" }, panel);

  function close() {
    overlay.remove();
    document.removeEventListener("keydown", onKey);
  }
  function onKey(ev) {
    if (ev.key === "Escape") close();
  }
  overlay.addEventListener("click", (ev) => { if (ev.target === overlay) close(); });
  cancelBtn.addEventListener("click", close);
  document.addEventListener("keydown", onKey);

  confirmBtn.addEventListener("click", async () => {
    errorBox.textContent = "";
    if (opts.validate) {
      const err = opts.validate();
      if (err) { errorBox.textContent = err; return; }
    }
    confirmBtn.disabled = true;
    cancelBtn.disabled = true;
    try {
      await opts.onConfirm();
      close();
    } catch (e) {
      errorBox.textContent = e.message;
      confirmBtn.disabled = false;
      cancelBtn.disabled = false;
    }
  });

  root.appendChild(overlay);
  // 最初の入力欄にフォーカス、無ければ確認ボタン
  const firstInput = panel.querySelector("input, select, textarea");
  (firstInput || confirmBtn).focus();
  return { close };
}

function field(labelText, control, hintText) {
  return el("div", { class: "field" }, [
    el("label", { text: labelText }),
    control,
    hintText ? el("div", { class: "muted small", text: hintText }) : null,
  ]);
}

// --------------------------------------------------------------------------
// 予告タイミングの選択（チップ + 自由入力）
// --------------------------------------------------------------------------
const OFFSET_PRESETS = [600, 300, 180, 60, 30, 10];

function offsetPicker(selected) {
  const chosen = new Set(selected || [300, 60, 30]);
  const custom = el("input", { type: "text", placeholder: "任意の秒数をカンマ区切りで（例: 900,120）" });
  const chips = el("div", { class: "chips" });

  for (const sec of OFFSET_PRESETS) {
    const chip = el("div", {
      class: "chip" + (chosen.has(sec) ? " on" : ""),
      text: offsetLabel(sec),
      role: "button",
      tabindex: "0",
    });
    const toggle = () => {
      if (chosen.has(sec)) { chosen.delete(sec); chip.classList.remove("on"); }
      else { chosen.add(sec); chip.classList.add("on"); }
    };
    chip.addEventListener("click", toggle);
    chip.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
    });
    chips.appendChild(chip);
  }

  // プリセットに無い値は自由入力欄に戻しておく
  const extras = (selected || []).filter(s => !OFFSET_PRESETS.includes(s));
  if (extras.length) custom.value = extras.join(",");

  function values() {
    const out = new Set(chosen);
    for (const part of custom.value.split(",")) {
      const n = Number(part.trim());
      if (part.trim() && Number.isFinite(n) && n >= 0) out.add(n);
    }
    return Array.from(out).sort((a, b) => b - a);
  }
  return {
    node: el("div", null, [chips, el("div", { style: "margin-top:8px" }, custom)]),
    values,
  };
}

// アナウンス文 + 予告タイミングの入力セット（再起動/停止/予約で共用）
function announceFields(defaults) {
  const message = el("input", {
    type: "text",
    value: (defaults && defaults.message) || "",
    placeholder: "サーバーは{time}後に再起動します。",
    maxlength: "500",
  });
  const picker = offsetPicker(defaults && defaults.offsets);

  return {
    nodes: [
      field("ゲーム内アナウンス文（必須）", message,
        "{time} が残り時間に置き換わります。省略すると毎回同じ文面で流れます。"),
      field("予告タイミング（必須・1つ以上）", picker.node,
        "選んだタイミングごとにゲーム内へ予告します。一番早いものが実行までの猶予になります。"),
    ],
    validate() {
      if (!message.value.trim()) return "アナウンス文を入力してください";
      if (!picker.values().length) return "予告タイミングを1つ以上選んでください";
      return null;
    },
    payload() {
      return { announce_message: message.value.trim(), notice_offsets: picker.values() };
    },
  };
}

// --------------------------------------------------------------------------
// サーバ操作モーダル（再起動 / 停止 / 起動）
// --------------------------------------------------------------------------
function openSequenceModal(mode, onDone) {
  const isStop = mode === "stop";
  const label = isStop ? "停止" : "再起動";
  const template = state.config
    ? (isStop ? state.config.stop_announce_template : state.config.restart_announce_template)
    : "";
  const fields = announceFields({
    message: template,
    offsets: (state.config && state.config.notice_offsets) || [300, 60, 30],
  });
  const reason = el("input", { type: "text", placeholder: "例: 定期メンテナンス", value: "手動" });

  openModal({
    title: `サーバーを${label}します`,
    lead: `予告アナウンスを流したあと、ワールドを保存してから${label}します。保存に失敗した場合は${label}を中止します。`,
    danger: true,
    confirmLabel: `${label}シーケンスを開始`,
    body: [
      el("div", { class: "warnbox" },
        isStop ? "停止するとプレイヤーは全員切断され、サーバは起動しません。再度動かすには「サーバーを起動」が必要です。"
               : "再起動中はプレイヤーが全員切断されます。"),
      el("div", { class: "field" }, [el("label", { text: "理由（Discord に記録されます）" }), reason]),
    ].concat(fields.nodes),
    validate: fields.validate,
    async onConfirm() {
      const payload = Object.assign({ reason: reason.value.trim() || "手動" }, fields.payload());
      await post(isStop ? "/api/shutdown" : "/api/restart", payload);
      toast(`${label}シーケンスを開始しました`, "ok");
      if (onDone) onDone();
    },
  });
}

function openStartModal(onDone) {
  const reason = el("input", { type: "text", placeholder: "例: メンテ明け", value: "手動" });
  openModal({
    title: "サーバーを起動します",
    lead: "systemd ユニットを起動します。停止中のサーバにはアナウンスを送れないため、予告はありません。",
    confirmLabel: "起動する",
    body: [
      el("div", { class: "infobox", text: "既に起動している場合は何も起きません。" }),
      el("div", { class: "field" }, [el("label", { text: "理由（Discord に記録されます）" }), reason]),
    ],
    async onConfirm() {
      await post("/api/service/start", { reason: reason.value.trim() || "手動" });
      toast("起動コマンドを実行しました", "ok");
      if (onDone) onDone();
    },
  });
}

// --------------------------------------------------------------------------
// ログインと閲覧専用モード
// --------------------------------------------------------------------------
/** サーバを操作できるか。
 *
 *  未ログインでも画面は見られる（Issue #15）。操作系の UI はここで塞ぐ。
 *  塞ぐのは操作ミスを減らすためで、実際の可否はサーバ側が 401 で決めている。
 */
function canOperate() {
  if (!state.config) return false;
  return !state.config.auth_required || state.config.authenticated;
}

/** 操作系のボタンや入力を、閲覧専用のときだけ押せなくする。 */
function gate(node) {
  if (!node || canOperate()) return node;
  node.disabled = true;
  node.title = "閲覧のみです。操作するにはログインしてください";
  return node;
}

/** 操作できない理由を画面上でも伝える。操作できるときは何も出さない。 */
function readOnlyNote(text) {
  if (canOperate()) return null;
  return el("div", { class: "infobox row", style: "margin-bottom:10px" }, [
    el("span", { text: text || "閲覧のみです。操作するにはログインしてください。" }),
    el("button", { class: "btn small", text: "ログイン", onclick: () => showLogin("") }),
  ]);
}

function showLogin(message) {
  // 進行中の更新を止める。ログイン画面の裏で回し続ける意味がない
  if (state.refresher) { clearInterval(state.refresher); state.refresher = null; }
  if (state.ws) { state.ws.close(); state.ws = null; }

  $("login-screen").classList.add("show");

  const err = $("login-error");
  err.textContent = message || "";
  $("login-password").value = "";
  // ID は消さない。入れ直させる意味がなく、打ち直しが手間なだけ
  const id = $("login-username");
  (id.value ? $("login-password") : id).focus();
}

function hideLogin() {
  $("login-screen").classList.remove("show");
}

/** ログインせずに見る。閲覧専用のまま画面を組み立て直す。 */
async function browseAsGuest() {
  hideLogin();
  $("login-error").textContent = "";
  await start();
}

async function submitLogin() {
  const id = $("login-username");
  const pw = $("login-password");
  const err = $("login-error");
  const btn = $("login-submit");
  if (!id.value) { err.textContent = "ログインIDを入力してください"; id.focus(); return; }
  if (!pw.value) { err.textContent = "パスワードを入力してください"; pw.focus(); return; }

  btn.disabled = true;
  try {
    await post("/api/login", { username: id.value, password: pw.value });
    pw.value = "";
    err.textContent = "";
    hideLogin();
    await start();
  } catch (e) {
    err.textContent = e.message;
    pw.select();
  } finally {
    btn.disabled = false;
  }
}

async function logout() {
  try { await post("/api/logout"); } catch (e) { /* 失敗しても閲覧専用へ戻す */ }
  state.status = null;
  // ログアウト後も閲覧はできる。ログイン画面で止めない
  await start();
  toast("ログアウトしました。閲覧のみになります", "ok");
}

  config: null,

  state.view = id;

  for (const t of state.timers) clearInterval(t);
  state.timers = [];
  if (state.ws) { state.ws.close(); state.ws = null; }

  buildTopbar();
  closeDrawer();
  const view = VIEWS.find(v => v.id === id) || VIEWS[0];

  clear(root);
  view.render(root);
}

  const group = (ids) => {

    for (const id of ids) {
      const v = VIEWS.find(x => x.id === id);
      if (!v) continue;
      box.appendChild(el("button", {
        class: "navbtn" + (v.id === state.view ? " active" : ""),
        text: v.name,
        onclick: () => setView(v.id),
      }));

    return box;
  };
  bar.appendChild(group(NAV_TOP));
  bar.appendChild(el("div", { class: "navsep" }));
  bar.appendChild(group(VIEWS.filter(v => !NAV_TOP.includes(v.id)).map(v => v.id)));

  bar.appendChild(el("div", { class: "spacer" }));

  if (state.config && state.config.auth_required) {
    bar.appendChild(el("div", { class: "sidefoot" }, canOperate()
      ? [
          el("div", { class: "who", text: state.config.app_user || "ログイン中" }),
          el("button", {
            class: "act out", text: "ログアウト",
            onclick: () => openModal({
              title: "ログアウトします",
              lead: "閲覧は続けられますが、再び操作するにはログインが必要になります。",
              confirmLabel: "ログアウト",
              onConfirm: logout,
            }),
          }),
        ]
      : [
          el("div", { class: "who", text: "閲覧のみ" }),
          el("button", { class: "act in", text: "ログイン", onclick: () => showLogin("") }),
        ]));
  }
}

function buildTopbar() {
  const bar = $("topbar");
  clear(bar);

  const s = state.status;
  const online = s ? s.online : null;
  const cfg = state.config || {};

  bar.appendChild(el("button", {
    class: "hamburger", id: "hamburger", "aria-label": "メニュー", text: "☰",
    onclick: openDrawer,
  }));

  bar.appendChild(el("div", { class: "servername" }, [
    el("span", { class: "statusdot " + (online === null ? "" : online ? "online" : "offline") }),
    el("span", { text: (s && s.info && s.info.servername) || "Palworld Server" }),
  ]));

  const facts = [];
  if (s && s.metrics && s.metrics.uptime !== undefined && online) {
    facts.push(el("span", { text: "稼働中 " + fmtDuration(s.metrics.uptime) }));
  } else if (online === false) {
    facts.push(el("span", { text: "応答なし" }));
  }
  if (cfg.pal_base_url) {
    if (facts.length) facts.push(el("span", { class: "sep", text: "|" }));
    facts.push(el("span", { text: cfg.pal_base_url.replace(/^https?:\/\//, "") }));
  }
  bar.appendChild(el("div", { class: "facts" }, facts));

  // サーバ操作。停止中は「起動」だけを出す（落ちているサーバは止められない）
  const actions = el("div", { class: "actions" });
  const refresh = () => { buildTopbar(); };
  if (online === false) {
    actions.appendChild(gate(el("button", {
      class: "btn primary", text: "起動",
      onclick: () => openStartModal(refresh),
    })));
  } else {
    actions.appendChild(gate(el("button", {
      class: "btn", text: "ワールド保存",
      onclick: () => openModal({
        title: "ワールドを保存します",
        lead: "サーバに保存を指示します。プレイヤーへの影響はありません。",
        confirmLabel: "保存する",
        async onConfirm() { await post("/api/save"); toast("ワールドを保存しました", "ok"); },
      }),
    })));
    actions.appendChild(gate(el("button", {
      class: "btn primary", text: "再起動",
      onclick: () => openSequenceModal("restart", refresh),
    })));
    actions.appendChild(gate(el("button", {
      class: "btn danger", text: "停止",
      onclick: () => openSequenceModal("stop", refresh),
    })));
  }
  bar.appendChild(actions);
}

function announcementTable(records) {
  if (!records.length) {
    return el("div", { class: "muted", style: "padding:16px", text: "アナウンス履歴はまだありません" });
  }
  const wrap = el("div", { class: "tablewrap" });
  const table = el("table");
  table.appendChild(el("thead", null, el("tr", null,
    ["日時", "区分", "内容", "宛先", "結果"].map(h => el("th", { text: h })))));
  const tbody = el("tbody");
  for (const r of records) {
    const targets = [];
    if (r.to_game) targets.push("ゲーム内");
    if (r.to_discord) targets.push("Discord");
    tbody.appendChild(el("tr", null, [
      el("td", { class: "small", text: fmtTs(r.ts) }),
      el("td", { class: "small", text: r.source_label }),
      el("td", null, [
        el("div", { text: r.message }),
        r.reason ? el("div", { class: "muted small", text: "理由: " + r.reason }) : null,
      ]),
      el("td", { class: "muted small", text: targets.join(" / ") || "-" }),
      el("td", { class: "small " + (r.ok ? "" : "muted") },
        r.ok ? "成功" : "失敗"),
    ]));
    if (!r.ok && r.detail) {
      tbody.appendChild(el("tr", null,
        el("td", { colspan: "5", class: "muted small", text: r.detail })));
    }
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

/** 折れ線を SVG で描く。カード内の小さな傾向表示用。
 *
 *  値の読み取りは隣の大きな数字に任せ、ここでは形だけ見せる。
 *  そのため軸も目盛りも置かない。
 */
function sparkline(values, color) {
  const W = 120, H = 26;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("class", "spark");

  const nums = values.filter(v => typeof v === "number");
  if (nums.length < 2) return svg;

  const min = Math.min.apply(null, nums);
  const max = Math.max.apply(null, nums);
  // 平坦な系列でも真ん中に線が出るようにする（0除算よけも兼ねる）
  const span = (max - min) || 1;
  const pad = 3;
  const pts = nums.map((v, i) => {
    const x = (i / (nums.length - 1)) * W;
    const y = H - pad - ((v - min) / span) * (H - pad * 2);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");

  const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  line.setAttribute("points", pts);
  line.setAttribute("fill", "none");
  line.setAttribute("stroke", color);
  line.setAttribute("stroke-width", "2");
  line.setAttribute("vector-effect", "non-scaling-stroke");
  svg.appendChild(line);
  return svg;
}

function statcard(label, valueNode, footText, extraNode) {
