// サーバ設定（サーバ操作 + PalWorldSettings.ini）
// --------------------------------------------------------------------------
function renderSettings(root) {
  root.appendChild(el("h1", { text: "サーバ設定" }));

  // --- サーバ操作（サーバに対する操作はすべてここに集約している） ---
  const serviceInfo = el("div", { class: "muted small", style: "margin-bottom:12px" });
  const sequenceBox = el("div", { style: "margin-top:12px" });
  root.appendChild(el("h2", { text: "サーバ操作" }));
  root.appendChild(el("div", { class: "panel" }, [
    readOnlyNote("サーバ設定の操作にはログインが必要です。状態の閲覧はできます。"),
    serviceInfo,
    el("div", { class: "row" }, [
      gate(el("button", {
        class: "btn primary", text: "サーバーを起動",
        onclick: () => openStartModal(refreshSequence),
      })),
      gate(el("button", {
        class: "btn danger", text: "サーバーを再起動",
        onclick: () => openSequenceModal("restart", refreshSequence),
      })),
      gate(el("button", {
        class: "btn danger", text: "サーバーを停止",
        onclick: () => openSequenceModal("stop", refreshSequence),
      })),
      gate(el("button", {
        class: "btn", text: "ワールド保存",
        onclick: () => openModal({
          title: "ワールドを保存します",
          lead: "サーバに保存を指示します。プレイヤーへの影響はありません。",
          confirmLabel: "保存する",
          async onConfirm() { await post("/api/save"); toast("ワールドを保存しました", "ok"); },
        }),
      })),
    ]),
    el("div", { class: "muted small", style: "margin-top:10px" },
      "再起動と停止は、予告アナウンス → ワールド保存 → 停止 の順に実行します。保存に失敗した場合は中止します。"),
    sequenceBox,
  ]));

  // 進行中のシーケンスをこのタブでも操作できるようにする
  async function refreshSequence() {
    let r;
    try { r = await api("/api/restart"); }
    catch (e) { return; }
    clear(sequenceBox);
    if (!r.in_progress) return;
    sequenceBox.appendChild(el("div", { class: "warnbox row" }, [
      el("strong", { text: r.mode_label + "シーケンス進行中" }),
      el("span", { text: "(" + r.phase + ") " + r.message }),
      r.seconds_remaining !== null && r.seconds_remaining !== undefined
        ? el("span", { text: "残り " + fmtDuration(r.seconds_remaining) }) : null,
      r.cancellable ? gate(el("button", {
        class: "btn danger", text: "キャンセル",
        onclick: () => openModal({
          title: r.mode_label + "をキャンセルします",
          lead: "予告済みのプレイヤーにキャンセルを通知します。",
          confirmLabel: "キャンセルする",
          async onConfirm() {
            await post("/api/restart/cancel");
            toast(r.mode_label + "をキャンセルしました", "ok");
            refreshSequence();
          },
        }),
      })) : null,
    ]));
  }

  // --- ini 編集 ---
  const pathInfo = el("div", { class: "muted", style: "margin-bottom:10px" });
  const area = el("textarea", { spellcheck: "false" });
  const backups = el("div");
  root.appendChild(el("h2", { text: "PalWorldSettings.ini（直接編集）" }));
  root.appendChild(el("div", { class: "infobox row", style: "margin-bottom:10px" }, [
    el("span", { text: "項目ごとに編集したい場合は「ゲーム設定」タブが使えます。ここは全文をそのまま書き換える上級者向けです。" }),
    el("button", { class: "btn small", text: "ゲーム設定へ", onclick: () => setView("gamesettings") }),
  ]));
  root.appendChild(pathInfo);
  root.appendChild(area);
  root.appendChild(el("div", { class: "row", style: "margin-top:10px" }, [
    gate(el("button", {
      class: "btn primary", text: "保存",
      onclick: () => openModal({
        title: "設定ファイルを上書きします",
        lead: "上書き前に自動でバックアップを取ります。保存後、サーバを起動すると反映されます。",
        danger: true,
        confirmLabel: "上書き保存する",
        body: [
          el("div", { class: "warnbox" }, [
            el("div", { text: "内容が壊れているとサーバが起動しなくなります。OptionSettings 行の形式を確認してください。" }),
            el("div", { style: "margin-top:6px",
              text: "また Palworld は停止時に ini を上書きするため、稼働中に保存しても変更は失われます。"
                  + "サーバ停止中に保存してください（稼働中の保存はサーバ側で拒否されます）。" }),
          ]),
        ],
        async onConfirm() {
          const r = await put("/api/settings-ini", { text: area.value });
          toast("保存しました（バックアップ: " + r.backup + "）。サーバを起動すると反映されます", "ok");
          load();
        },
      }),
    })),
    el("button", { class: "btn", text: "読み直す", onclick: () => load() }),
  ]));
  root.appendChild(el("h2", { text: "バックアップ" }));
  root.appendChild(backups);

  async function load() {
    if (state.config) {
      serviceInfo.textContent = "systemd ユニット: " + state.config.pal_service_name;
    }
    let data;
    try { data = await api("/api/settings-ini"); }
    catch (e) { pathInfo.textContent = "読み込みに失敗しました: " + e.message; return; }

    pathInfo.textContent = data.exists ? data.path : "設定ファイルが見つかりません: " + data.path;
    area.value = data.text || "";
    // 閲覧専用のときはパスワードが伏字で入っている。編集させると、
    // 伏字をそのまま保存して本物のパスワードを潰しかねない
    area.disabled = !data.exists || !canOperate();

    clear(backups);
    if (!data.backups.length) {
      backups.appendChild(el("div", { class: "muted", text: "バックアップはまだありません" }));
      return;
    }
    const wrap = el("div", { class: "tablewrap" });
    const table = el("table");
    table.appendChild(el("thead", null, el("tr", null,
      ["ファイル名", "作成日時", "サイズ", ""].map(h => el("th", { text: h })))));
    const tbody = el("tbody");
    for (const b of data.backups) {
      tbody.appendChild(el("tr", null, [
        el("td", { text: b.name }),
        el("td", { text: fmtTime(b.created_at) }),
        el("td", { text: b.size + " B" }),
        el("td", null, gate(el("button", {
          class: "btn", text: "この内容に戻す",
          onclick: () => openModal({
            title: "バックアップから復元します",
            lead: b.name + " の内容で上書きします。復元前の状態も自動でバックアップされます。",
            danger: true,
            confirmLabel: "復元する",
            async onConfirm() {
              await post("/api/settings-ini/restore", { name: b.name });
              toast("復元しました", "ok");
              load();
            },
          }),
        }))),
      ]));
    }
    table.appendChild(tbody);
    wrap.appendChild(table);
    backups.appendChild(wrap);
  }
  load();
  refreshSequence();
  // 進行中シーケンスの残り時間を追いたいので、この画面も定期更新する
  state.refresher = setInterval(refreshSequence, 1000);
}

// --------------------------------------------------------------------------
// ゲーム設定（PalWorldSettings.ini を項目ごとに編集する）
// --------------------------------------------------------------------------
function renderGameSettings(root) {
  root.appendChild(el("h1", { text: "ゲーム設定" }));
  const pathInfo = el("div", { class: "muted small", style: "margin-bottom:12px" });
  const runningWarn = el("div", { style: "margin-bottom:12px" });
  const note = readOnlyNote(
    "閲覧のみです。値の変更にはログインが必要で、パスワード系は値も伏せています。");
  if (note) root.appendChild(note);
  root.appendChild(pathInfo);
  root.appendChild(runningWarn);

  const search = el("input", { type: "text", placeholder: "項目名で絞り込み（例: rate, pvp, ExpRate）", style: "flex:1;min-width:220px" });
  const onlyChanged = el("input", { type: "checkbox" });
  root.appendChild(el("div", { class: "row", style: "margin-bottom:12px" }, [
    search,
    el("label", { class: "row muted small" }, [onlyChanged, "変更した項目だけ表示"]),
  ]));

  const pendingBox = el("div");
  root.appendChild(pendingBox);

  const catbar = el("div", { class: "catbar" });
  const grid = el("div", { class: "fieldgrid" });
  const availableBox = el("div");
  const savebar = el("div", { class: "savebar" });
  let showAvailable = false;
  root.appendChild(catbar);
  root.appendChild(grid);
  root.appendChild(availableBox);
  root.appendChild(savebar);

  // name -> { spec, original }
  const specs = new Map();
  // name -> 編集後の値（元の値と同じになったら削除する）
  const edits = new Map();
  // 設定ファイルに無い項目を、明示操作で追加したぶん: name -> 値
  const additions = new Map();
  // 追加できる項目（ファイル未記載）: name -> field
  const availableByName = new Map();
  let categories = [];
  let available = [];
  let discovered = [];
  let serverRunning = false;
  let pendingItems = [];      // 反映待ちの変更
  let schedules = [];         // 反映先に選べる予約（再起動/停止のみ）
  // 自分で名前と型を指定して追加した項目: name -> {name, type, value, label, ...}
  const customs = new Map();
  let activeCat = "__all__";

  function isChanged(name) { return edits.has(name) || additions.has(name) || customs.has(name); }

  function displayValue(spec, value) {
    if (spec.type === "bool") return value ? "有効" : "無効";
    if (spec.secret) return value ? "********" : "(空)";
    if (value === "" || value === null || value === undefined) return "(空)";
    return String(value);
  }

  /** 値を取り込む。
   *
   *  live=true（入力中）のときは一覧を作り直さない。作り直すと入力中の
   *  要素ごと破棄され、1文字打つたびにフォーカスが外れて続きが打てなくなる。
   *  そのカードの見た目と保存バーだけを更新する。
   */
  function setEdit(name, value, live) {
    const spec = specs.get(name);
    if (spec && spec.spec.locked) return;   // 念のため二重で止める

    // 新規追加した項目は、元の値が無いので常に「変更あり」として持つ
    if (customs.has(name)) {
      customs.get(name).value = value;
    } else if (additions.has(name)) {
      additions.set(name, value);
    } else {
      const entry = specs.get(name);
      if (!entry) return;
      // 数値は型を揃えてから比較する（"1.0" と 1 を別物にしない）
      const same = entry.spec.type === "int" || entry.spec.type === "float"
        ? Number(value) === Number(entry.original)
        : value === entry.original;
      if (same) edits.delete(name); else edits.set(name, value);
    }

    if (live) {
      refreshCard(name);
      paintSavebar();
    } else {
      paint();
    }
  }

  function addField(f) {
    additions.set(f.name, f.value);
    paint();
  }

  function removeAddition(name) {
    additions.delete(name);
    customs.delete(name);
    paint();
  }

  // 名前と型を指定して、スキーマにも ini にも無い項目を追加する
  function openCustomModal() {
    const name = el("input", { type: "text", placeholder: "例: bNewOptionFromUpdate" });
    const type = el("select", null, [
      el("option", { value: "bool", text: "有効/無効 (True/False)" }),
      el("option", { value: "int", text: "整数" }),
      el("option", { value: "float", text: "小数（1.000000 形式で書き込み）" }),
      el("option", { value: "string", text: "文字列（\"...\" で囲んで書き込み）" }),
    ]);
    const value = el("input", { type: "text", placeholder: "初期値（例: True / 10 / 1.5 / Steam）" });

    openModal({
      title: "項目を自分で追加する",
      lead: "この管理ツールがまだ把握していないプロパティを、名前と型を指定して設定ファイルに書き足します。"
          + "Palworld のアップデートで増えた項目を、ツールの更新を待たずに設定できます。",
      confirmLabel: "追加する",
      body: [
        el("div", { class: "infobox", text: "項目名のスペルはゲーム側と厳密に一致させてください。"
          + "誤った名前を書いてもゲームは無視するだけですが、意図した設定は効きません。" }),
        field("項目名", name, "英数字と _ のみ。先頭は英字か _"),
        field("型", type, "ini への書き方が変わります"),
        field("値", value),
      ],
      validate() {
        const n = name.value.trim();
        if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(n)) return "項目名は英数字と _ のみです（先頭は英字か _）";
        if (specs.has(n) || customs.has(n)) return "その項目はすでに一覧にあります";
        if (!value.value.trim() && type.value !== "string") return "値を入力してください";
        return null;
      },
      async onConfirm() {
        const n = name.value.trim();
        const raw = value.value.trim();
        let v = raw;
        if (type.value === "bool") v = /^(true|1|yes|on|有効)$/i.test(raw);
        else if (type.value === "int") v = parseInt(raw, 10);
        else if (type.value === "float") v = parseFloat(raw);
        if ((type.value === "int" || type.value === "float") && !Number.isFinite(v)) {
          throw new Error("数値として解釈できません: " + raw);
        }
        customs.set(n, {
          name: n, label: n, type: type.value, value: v,
          category: "other", known: false, choices: [], secret: false,
          min: null, max: null, step: null, custom: true,
        });
        paint();
      },
    });
  }

  // --- 入力コントロール ---
  function currentValue(f) {
    if (customs.has(f.name)) return customs.get(f.name).value;
    if (additions.has(f.name)) return additions.get(f.name);
    if (edits.has(f.name)) return edits.get(f.name);
    return f.value;
  }

  function buildControl(f) {
    const current = currentValue(f);

    // 変更すると管理ツールがサーバと通信できなくなる項目は編集させない。
    // 予約反映と組み合わさると、無人のまま締め出されることになる。
    // 未ログインの閲覧者も同じ扱いにする（Issue #15）。
    // パスワードはサーバ側で伏字にして返ってくるので、ここでも伏せたまま出す
    if (f.locked || !canOperate()) {
      const shown = el("input", {
        type: "text", value: f.secret ? "********" : String(current), readonly: "readonly",
      });
      shown.style.opacity = ".6";
      return shown;
    }

    if (f.type === "bool") {
      // 有効/無効はプルダウンで選ぶ
      const sel = el("select", null, [
        el("option", { value: "true", text: "有効" }),
        el("option", { value: "false", text: "無効" }),
      ]);
      sel.value = current ? "true" : "false";
      sel.addEventListener("change", () => setEdit(f.name, sel.value === "true", true));
      return sel;
    }

    if (f.type === "enum") {
      const sel = el("select", null,
        f.choices.map(c => el("option", { value: c, text: c })));
      // ファイルの値が選択肢に無い場合も選べるようにしておく
      if (!f.choices.includes(String(current))) {
        sel.appendChild(el("option", { value: String(current), text: String(current) + "（現在値）" }));
      }
      sel.value = String(current);
      sel.addEventListener("change", () => setEdit(f.name, sel.value, true));
      return sel;
    }

    if (f.type === "int" || f.type === "float") {
      const input = el("input", { type: "number", value: String(current) });
      if (f.min !== null && f.min !== undefined) input.min = String(f.min);
      if (f.max !== null && f.max !== undefined) input.max = String(f.max);
      input.step = String(f.step || (f.type === "int" ? 1 : 0.1));
      input.addEventListener("input", () => {
        // 空欄や "1." のような入力途中は数値にできないので、まだ取り込まない。
        // 画面は作り直さないので、打ちかけの文字はそのまま残る
        const n = f.type === "int" ? parseInt(input.value, 10) : parseFloat(input.value);
        if (!Number.isFinite(n)) return;
        setEdit(f.name, n, true);
      });
      return input;
    }

    // 文字列（パスワードは伏せて、ボタンで表示切替）
    const input = el("input", { type: f.secret ? "password" : "text", value: String(current) });
    input.addEventListener("input", () => setEdit(f.name, input.value, true));
    if (!f.secret) return input;
    const toggle = el("button", {
      class: "btn", text: "表示",
      onclick: () => {
        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        toggle.textContent = hidden ? "隠す" : "表示";
      },
    });
    return el("div", { class: "ctl" }, [input, toggle]);
  }

  // 推奨範囲を外れていたら知らせる。min/max は仕様ではなく目安なので止めはしない
  function rangeNote(f) {
    if (f.type !== "int" && f.type !== "float") return null;
    const v = Number(currentValue(f));
    if (!Number.isFinite(v)) return null;
    const low = f.min !== null && f.min !== undefined && v < f.min;
    const high = f.max !== null && f.max !== undefined && v > f.max;
    if (!low && !high) return null;
    return el("div", { class: "muted small", style: "color:var(--warn)",
      text: `推奨範囲（${f.min}〜${f.max}）を${low ? "下回っています" : "超えています"}。保存はできます。` });
  }

  // 入力中の要素を作り直すとフォーカスもカーソル位置も失われ、
  // 1文字打つたびに入力できなくなる。そこでカードを
  //   ・操作部（input / select）  … 一度作ったら触らない
  //   ・装飾部（バッジ・注記）    … 値が変わるたびに詰め替える
  // に分け、装飾部だけを更新できるようにしておく。
  const cards = new Map();   // name -> { card, badges, notes, field }

  function badgeNodes(f) {
    const isNew = additions.has(f.name) || customs.has(f.name);
    const changed = isChanged(f.name);
    return [
      f.locked ? el("span", { class: "tag-locked", text: "変更不可" }) : null,
      !f.known ? el("span", { class: "tag-unknown", text: "未知" }) : null,
      isNew ? el("span", { class: "tag-added", text: "新規追加" })
            : (changed ? el("span", { class: "tag-changed", text: "変更" }) : null),
    ].filter(Boolean);
  }

  function noteNodes(f) {
    const isNew = additions.has(f.name) || customs.has(f.name);
    const changed = isChanged(f.name);
    const nodes = [];

    // 難易度を None 以外にすると個別の倍率設定が無視される（公式仕様）
    if (f.overrides_others && String(currentValue(f)) !== "None") {
      nodes.push(el("div", { class: "warnbox small", style: "margin-top:2px",
        text: "この設定が有効な間、経験値倍率や捕獲率などの個別設定は無視されます。"
            + "個別に調整したい場合は None を選んでください。" }));
    }
    // 推奨範囲はこちらで決めた目安。外れていても保存はできる
    const range = rangeNote(f);
    if (range) nodes.push(range);

    if (isNew) {
      nodes.push(el("div", { class: "row small" }, [
        el("span", { class: "muted", text: "設定ファイルに新しく書き足します" }),
        el("button", { class: "btn small", text: "やめる", onclick: () => removeAddition(f.name) }),
      ]));
    } else if (changed) {
      nodes.push(el("div", { class: "row small" }, [
        el("span", { class: "muted", text: "元: " + displayValue(f, specs.get(f.name).original) }),
        el("button", {
          class: "btn small", text: "戻す",
          onclick: () => { edits.delete(f.name); paint(); },
        }),
      ]));
    } else if (f.help) {
      nodes.push(el("div", { class: "help", text: f.help }));
    }
    return nodes;
  }

  function buildCard(f) {
    const badges = el("div", { class: "row" }, badgeNodes(f));
    const notes = el("div", { class: "notes" }, noteNodes(f));
    const card = el("div", { class: "setting" + (isChanged(f.name) ? " changed" : "") }, [
      el("div", { class: "head" }, [
        el("div", null, [
          el("div", { class: "title", text: f.label }),
          el("div", { class: "name", text: f.name }),
        ]),
        badges,
      ]),
      buildControl(f),
      notes,
    ]);
    cards.set(f.name, { card, badges, notes, field: f });
    return card;
  }

  /** 操作部はそのままに、バッジと注記だけ差し替える。
   *  入力中に呼んでもフォーカスとカーソル位置が保たれる。 */
  function refreshCard(name) {
    const entry = cards.get(name);
    if (!entry) return;
    const { card, badges, notes, field } = entry;
    card.classList.toggle("changed", isChanged(name));
    clear(badges);
    for (const n of badgeNodes(field)) badges.appendChild(n);
    clear(notes);
    for (const n of noteNodes(field)) notes.appendChild(n);
  }

  // 設定ファイルに書かれていない項目のカード（追加ボタン付き）
  function buildAvailableCard(f) {
    return el("div", { class: "setting muted-card" }, [
      el("div", { class: "head" }, [
        el("div", null, [
          el("div", { class: "title", text: f.label }),
          el("div", { class: "name", text: f.name }),
        ]),
        gate(el("button", { class: "btn small", text: "追加", onclick: () => addField(f) })),
      ]),
      el("div", { class: "help", text: f.default_known
        ? "未設定（ゲーム側の既定値 " + displayValue(f, f.default) + " で動作中）"
        : "未設定（既定値は未確認。追加すると " + displayValue(f, f.value) + " で書き込まれます）" }),
    ]);
  }

  function matches(f) {
    const q = search.value.trim().toLowerCase();
    if (activeCat !== "__all__" && f.category !== activeCat) return false;
    if (!q) return true;
    return f.name.toLowerCase().includes(q) || f.label.toLowerCase().includes(q);
  }

  function visibleFields() {
    const out = [];
    // 追加したものは一覧の先頭に出す（今どこを触っているか見失わないように）
    for (const [, f] of customs) {
      if (matches(f)) out.push(f);
    }
    for (const [name] of additions) {
      const f = availableByName.get(name);
      if (f && matches(f)) out.push(f);
    }
    for (const cat of categories) {
      for (const f of cat.fields) {
        if (onlyChanged.checked && !isChanged(f.name)) continue;
        if (!matches(f)) continue;
        out.push(f);
      }
    }
    return out;
  }

  // まだ追加していない未設定項目（スキーマ由来 + 稼働中サーバから発見したもの）
  function availableFields() {
    const out = [];
    for (const cat of available) {
      for (const f of cat.fields) {
        if (additions.has(f.name)) continue;
        if (!matches(f)) continue;
        out.push(f);
      }
    }
    for (const f of discovered) {
      if (additions.has(f.name) || customs.has(f.name)) continue;
      if (!matches(f)) continue;
      out.push(f);
    }
    return out;
  }

  function paintCatbar() {
    clear(catbar);
    const total = categories.reduce((n, c) => n + c.fields.length, 0);
    const entries = [{ key: "__all__", label: "すべて", n: total }]
      .concat(categories.map(c => ({ key: c.key, label: c.label, n: c.fields.length })));
    for (const e of entries) {
      const btn = el("button", { class: "catbtn" + (activeCat === e.key ? " on" : "") }, [
        e.label, el("span", { class: "count", text: String(e.n) }),
      ]);
      btn.addEventListener("click", () => { activeCat = e.key; paint(); });
      catbar.appendChild(btn);
    }
  }

  function paintSavebar() {
    clear(savebar);
    // 閲覧専用では編集できないので、差分バー自体を出さない
    if (!canOperate()) return;
    const newCount = additions.size + customs.size;
    const n = edits.size + newCount;
    const label = n
      ? n + " 件の変更" + (newCount ? "（新規追加 " + newCount + "）" : "")
      : "変更なし";
    savebar.appendChild(el("strong", { text: label }));
    savebar.appendChild(el("span", { class: "muted small",
      text: !n ? "項目を編集すると差分がここに出ます"
        : serverRunning ? "保存にはサーバの停止が必要です"
        : "保存後、サーバを起動すると反映されます" }));
    savebar.appendChild(el("div", { style: "flex:1" }));
    savebar.appendChild(el("button", {
      class: "btn", text: "変更を破棄", disabled: n ? null : "disabled",
      onclick: () => { edits.clear(); additions.clear(); customs.clear(); paint(); },
    }));
    savebar.appendChild(el("button", {
      class: "btn primary", text: "変更を保存", disabled: n ? null : "disabled",
      onclick: openSaveModal,
    }));
  }

  function paint() {
    paintCatbar();
    clear(grid);
    cards.clear();   // 作り直すので古い参照は捨てる
    const fields = visibleFields();
    if (!fields.length) {
      grid.appendChild(el("div", { class: "panel muted", text: "該当する項目がありません" }));
    }
    for (const f of fields) grid.appendChild(buildCard(f));

    // --- 設定ファイルに書かれていない項目 ---
    clear(availableBox);
    const rest = availableFields();
    if (rest.length) {
      availableBox.appendChild(el("div", { class: "row", style: "margin:22px 0 8px" }, [
        el("h2", { style: "margin:0", text: "未設定の項目（" + rest.length + "）" }),
        el("button", {
          class: "btn small", text: showAvailable ? "隠す" : "表示する",
          onclick: () => { showAvailable = !showAvailable; paint(); },
        }),
      ]));
      availableBox.appendChild(el("div", { class: "muted small", style: "margin-bottom:10px",
        text: "設定ファイルに書かれていない項目です。ゲーム側の既定値で動作しています。"
            + "値を変えたい項目だけ「追加」してください（追加した項目だけが書き足されます）。" }));
      if (showAvailable) {
        const g = el("div", { class: "fieldgrid" });
        for (const f of rest) g.appendChild(buildAvailableCard(f));
        availableBox.appendChild(g);
      }
    }
    // 一覧のどこにも無いプロパティを、自分で足すための入口
    if (canOperate()) {
      availableBox.appendChild(el("div", { class: "row", style: "margin-top:16px" }, [
        el("button", { class: "btn", text: "＋ 一覧に無い項目を自分で追加", onclick: openCustomModal }),
        el("span", { class: "muted small",
          text: "Palworld のアップデートで増えた項目を、このツールの更新を待たずに設定できます" }),
      ]));
    }
    paintSavebar();
  }

  function diffRow(label, name, beforeText, afterText) {
    return el("div", { class: "row2" }, [
      el("div", null, [
        el("div", { text: label }),
        el("div", { class: "name muted small", text: name }),
      ]),
      el("span", { class: "muted", text: "→" }),
      el("div", null, [
        el("div", { class: "before", text: beforeText }),
        el("div", { class: "after", text: afterText }),
      ]),
    ]);
  }

  // 反映タイミングの選択。ここが「稼働中でも保存できる」入口になる
  function timingPicker() {
    const usable = schedules.filter(s => s.enabled && s.action !== "start");
    const when = el("select", null, [
      el("option", { value: "next_stop", text: "次にサーバが停止するとき（予約・手動どちらでも）" }),
      usable.length ? el("option", { value: "schedule", text: "特定の予約のときに反映する" }) : null,
      el("option", { value: "now", text: "今すぐ反映する" + (serverRunning ? "（サーバ停止が必要）" : "") }),
    ]);
    when.value = serverRunning ? "next_stop" : "now";

    const schedSel = el("select", null, usable.map(s => el("option", {
      value: s.id,
      text: `${s.action_label} / ${s.label || s.spec} / 次回 ${fmtTime(s.next_action_at)}`,
    })));
    const schedBox = el("div", { class: "field", style: "display:none" }, [
      el("label", { text: "反映先の予約" }), schedSel,
    ]);
    const note = el("input", { type: "text", placeholder: "メモ（任意。例: PvP解禁）" });
    const hint = el("div", { class: "muted small" });

    function sync() {
      schedBox.style.display = when.value === "schedule" ? "" : "none";
      if (when.value === "now") {
        hint.textContent = serverRunning
          ? "サーバが稼働中のため今すぐは保存できません。停止するか、別のタイミングを選んでください。"
          : "設定ファイルに直接書き込みます。サーバを起動すると反映されます。";
      } else if (when.value === "schedule") {
        hint.textContent = "選んだ予約でサーバが停止したタイミングで、自動的に設定ファイルへ書き込まれます。";
      } else {
        hint.textContent = "予約・手動を問わず、次にサーバが停止したタイミングで自動的に書き込まれます。"
          + "それまで設定ファイルには触りません。";
      }
    }
    when.addEventListener("change", sync);
    sync();

    return {
      nodes: [
        field("いつ反映するか", when),
        schedBox,
        el("div", { class: "field" }, [el("label", { text: "メモ" }), note, hint]),
      ],
      get when() { return when.value; },
      validate() {
        if (when.value === "now" && serverRunning) {
          return "サーバ稼働中は今すぐ反映できません。別のタイミングを選んでください。";
        }
        if (when.value === "schedule" && !schedSel.value) return "反映先の予約を選んでください";
        return null;
      },
      payload() {
        const p = { when: when.value, note: note.value.trim() };
        if (when.value === "schedule") p.schedule_id = schedSel.value;
        return p;
      },
    };
  }

  function openSaveModal() {
    const list = el("div", { class: "difflist" });
    for (const [name, value] of edits) {
      const { spec, original } = specs.get(name);
      list.appendChild(diffRow(spec.label, name, displayValue(spec, original), displayValue(spec, value)));
    }
    for (const [name, value] of additions) {
      const f = availableByName.get(name);
      const before = f.default_known
        ? "未設定（既定 " + displayValue(f, f.default) + "）" : "未設定";
      list.appendChild(diffRow(f.label + "（新規追加）", name, before, displayValue(f, value)));
    }
    for (const [name, f] of customs) {
      list.appendChild(diffRow(name + "（手動で追加）", name, "未設定", displayValue(f, f.value)));
    }

    const newCount = additions.size + customs.size;
    const n = edits.size + newCount;
    const timing = timingPicker();

    openModal({
      title: n + " 件の設定を変更します",
      lead: "反映するタイミングを選べます。予約しておけば、"
          + "サーバ稼働中に入力しても指定のタイミングで自動的に反映されます。",
      danger: true,
      confirmLabel: "保存する",
      body: [
        newCount ? el("div", { class: "warnbox",
          text: newCount + " 件は設定ファイルに新しく書き足されます。"
              + "以降はゲーム側の既定値ではなく、ここで指定した値が使われます。" }) : null,
        list,
        el("div", { style: "margin-top:14px" }, timing.nodes),
      ],
      validate: timing.validate,
      async onConfirm() {
        const values = {}, adds = {};
        for (const [name, value] of edits) values[name] = value;
        for (const [name, value] of additions) adds[name] = value;
        const custom_additions = Array.from(customs.values())
          .map(f => ({ name: f.name, type: f.type, value: f.value }));

        const payload = Object.assign(
          { values, additions: adds, custom_additions }, timing.payload());
        const r = await put("/api/settings-ini/fields", payload);

        if (r.result === "unchanged") {
          toast("変更点がなかったため保存しませんでした");
        } else if (r.result === "scheduled") {
          toast("変更を予約しました。指定のタイミングで自動的に反映されます", "ok");
        } else {
          toast("保存しました（バックアップ: " + r.backup + "）。サーバを起動すると反映されます", "ok");
        }
        for (const w of (r.warnings || [])) toast(w, "err");
        edits.clear();
        additions.clear();
        customs.clear();
        await load();
      },
    });
  }

  // 反映待ちの変更。ここに残っている間、設定ファイルはまだ書き換わっていない
  function paintPending() {
    clear(pendingBox);
    if (!pendingItems.length) return;

    const wrap = el("div", { class: "tablewrap" });
    const table = el("table");
    table.appendChild(el("thead", null, el("tr", null,
      ["保存日時", "内容", "反映タイミング", "メモ", ""].map(h => el("th", { text: h })))));
    const tbody = el("tbody");
    for (const p of pendingItems) {
      const keys = Object.entries(p.updates).map(([k, v]) => k + "=" + v);
      tbody.appendChild(el("tr", null, [
        el("td", { class: "small", text: fmtTime(p.created_at) }),
        el("td", { class: "small", text: keys.join(", ") }),
        el("td", null, [
          el("div", { class: "small", text: p.target_label }),
          p.next_action_at ? el("div", { class: "muted small", text: fmtTime(p.next_action_at) }) : null,
          p.target_missing ? el("div", { class: "small",
            style: "color:var(--warn)", text: "紐づけ先の予約が削除されています（次の停止時に反映）" }) : null,
        ]),
        el("td", { class: "muted small", text: p.note || "-" }),
        el("td", null, gate(el("button", {
          class: "btn small danger", text: "取り消す",
          onclick: () => openModal({
            title: "予約した設定変更を取り消します",
            lead: keys.join(", "),
            danger: true,
            confirmLabel: "取り消す",
            async onConfirm() {
              await del("/api/settings-ini/pending/" + p.id);
              toast("取り消しました", "ok");
              await load();
            },
          }),
        }))),
      ]));
    }
    table.appendChild(tbody);
    wrap.appendChild(table);

    pendingBox.appendChild(el("h2", { text: "反映待ちの変更（" + pendingItems.length + "）" }));
    pendingBox.appendChild(el("div", { class: "muted small", style: "margin-bottom:8px",
      text: "まだ設定ファイルには書き込まれていません。指定したタイミングでサーバが停止したときに、自動的に反映されます。" }));
    pendingBox.appendChild(wrap);
    if (!serverRunning) {
      pendingBox.appendChild(el("div", { class: "row", style: "margin-top:8px" }, [
        gate(el("button", {
          class: "btn", text: "今すぐ反映する",
          onclick: () => openModal({
            title: "反映待ちの変更を今すぐ反映します",
            lead: "サーバが停止しているので、そのまま設定ファイルへ書き込めます。",
            confirmLabel: "反映する",
            async onConfirm() {
              const r = await post("/api/settings-ini/pending/apply");
              toast(r.applied + " 件を反映しました", "ok");
              await load();
            },
          }),
        })),
        el("span", { class: "muted small", text: "サーバ停止中なので、待たずに反映できます" }),
      ]));
    }
    pendingBox.appendChild(el("hr", { style: "border:0;border-top:1px solid var(--line);margin:18px 0" }));
  }

  async function load() {
    // 反映先の候補にするため、予約と保留中の変更も取っておく
    try {
      const [p, s] = await Promise.all([
        api("/api/settings-ini/pending"),
        api("/api/schedules"),
      ]);
      pendingItems = p.pending;
      schedules = s.schedules;
    } catch (e) { pendingItems = []; schedules = []; }

    let data;
    try { data = await api("/api/settings-ini/fields"); }
    catch (e) { pathInfo.textContent = "読み込みに失敗しました: " + e.message; return; }

    if (!data.exists) {
      pathInfo.textContent = "設定ファイルが見つかりません: " + data.path;
      clear(grid);
      grid.appendChild(el("div", { class: "panel muted", text: "編集できる項目がありません" }));
      clear(savebar);
      return;
    }

    categories = data.categories;
    available = data.available || [];
    discovered = data.discovered || [];
    serverRunning = !!data.server_running;

    clear(runningWarn);
    paintPending();

    // アップデートで項目が増えると、稼働中サーバがこちらの知らないキーを返してくる。
    // 見逃さないよう明示的に知らせる
    if (discovered.length) {
      runningWarn.appendChild(el("div", { class: "infobox", style: "margin-bottom:10px" }, [
        el("strong", { text: "この管理ツールが知らない設定項目が " + discovered.length + " 件見つかりました" }),
        el("div", { class: "small", style: "margin-top:4px",
          text: "稼働中のサーバは持っているのに、設定ファイルにも項目一覧にも無いものです。"
              + "Palworld のアップデートで増えた可能性があります。「未設定の項目」から追加できます。" }),
        el("div", { class: "muted small", style: "margin-top:4px",
          text: discovered.map(f => f.name).join(", ") }),
      ]));
    }

    if (serverRunning) {
      runningWarn.appendChild(el("div", { class: "infobox" }, [
        el("strong", { text: "サーバ稼働中です。変更は予約して反映できます" }),
        el("div", { style: "margin-top:4px",
          text: "Palworld は停止時に設定ファイルを上書きするため、稼働中の直接編集はできません。"
              + "そのかわり、保存時に反映タイミングを選べます。"
              + "予約しておけば、指定のタイミングでサーバが停止したときに自動で反映されます。" }),
        el("div", { class: "row", style: "margin-top:8px" }, [
          el("span", { class: "muted small", text: "今すぐ反映したい場合はサーバを停止してください" }),
          el("button", { class: "btn small", text: "サーバ操作へ", onclick: () => setView("settings") }),
          el("button", { class: "btn small", text: "スケジュールへ", onclick: () => setView("schedules") }),
        ]),
      ]));
    }

    specs.clear();
    availableByName.clear();
    let total = 0;
    for (const cat of categories) {
      for (const f of cat.fields) {
        specs.set(f.name, { spec: f, original: f.value });
        total++;
      }
    }
    let rest = 0;
    for (const cat of available) {
      for (const f of cat.fields) { availableByName.set(f.name, f); rest++; }
    }
    for (const f of discovered) { availableByName.set(f.name, f); rest++; }

    pathInfo.textContent = data.path + "  （設定済み " + total + " 項目"
      + (rest ? " / 未設定 " + rest + " 項目" : "") + "）"
      + (discovered.length ? "  ※うち " + discovered.length + " 件は稼働中サーバから検出" : "");
    paint();
  }

  search.addEventListener("input", paint);
  onlyChanged.addEventListener("change", paint);

  // ブラウザを使わずに入力の挙動を検証するための入口。
  // load() は fetch を使うので、テストからは状態を直接入れて描画させる
  globalThis.setFormStateForTest = (data) => {
    categories = data.categories || [];
    available = data.available || [];
    discovered = data.discovered || [];
    serverRunning = !!data.server_running;
    specs.clear();
    availableByName.clear();
    for (const cat of categories) {
      for (const f of cat.fields) specs.set(f.name, { spec: f, original: f.value });
    }
    for (const cat of available) {
      for (const f of cat.fields) availableByName.set(f.name, f);
    }
    for (const f of discovered) availableByName.set(f.name, f);
    paint();
  };
  globalThis.getEditsForTest = () => Object.fromEntries(edits);

  load();
}

// --------------------------------------------------------------------------
// 再起動予約
// --------------------------------------------------------------------------
const CRON_PRESETS = [
  { value: "0 4 * * *", label: "毎日 4:00" },
  { value: "0 5 * * 1", label: "毎週月曜 5:00" },
  { value: "0 */6 * * *", label: "6時間ごと" },
  { value: "0 4 1 * *", label: "毎月1日 4:00" },
  { value: "", label: "カスタム（自分で書く）" },
];

// ローカル時刻を YYYY-MM-DD で返す（toISOString は UTC になってしまう）
function localDateString(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

// 種別に応じた時刻入力を作る。値は spec 文字列として取り出す。
// initialSpec を渡すと既存の値で初期化する（編集時）。
function specPicker(initialKind, initialSpec, onKindChange) {
  const kind = el("select", null, [
    el("option", { value: "daily", text: "毎日" }),
    el("option", { value: "once", text: "単発（日時指定）" }),
    el("option", { value: "cron", text: "cron式" }),
  ]);
  kind.value = initialKind || "daily";

  // 毎日: 時・分のプルダウン
  const hour = el("select", null,
    Array.from({ length: 24 }, (_, i) => el("option", { value: String(i), text: String(i).padStart(2, "0") + "時" })));
  const minute = el("select", null,
    Array.from({ length: 12 }, (_, i) => el("option", { value: String(i * 5), text: String(i * 5).padStart(2, "0") + "分" })));
  hour.value = "4";
  minute.value = "0";
  const dailyBox = el("div", { class: "row" }, [hour, minute]);

  // 単発: カレンダー + 時刻
  const date = el("input", { type: "date" });
  const time = el("input", { type: "time", value: "04:00" });
  date.value = localDateString(new Date(Date.now() + 86400000));
  date.min = localDateString(new Date());
  const onceBox = el("div", { class: "row" }, [date, time]);

  // cron: プリセット + カスタム入力
  const cronPreset = el("select", null,
    CRON_PRESETS.map(p => el("option", { value: p.value, text: p.label })));
  const cronCustom = el("input", { type: "text", placeholder: "分 時 日 月 曜（例: 0 4 * * *）" });
  const cronBox = el("div", null, [cronPreset, el("div", { style: "margin-top:8px" }, cronCustom)]);
  function syncCron() {
    const custom = cronPreset.value === "";
    cronCustom.style.display = custom ? "" : "none";
    if (!custom) cronCustom.value = cronPreset.value;
  }
  cronPreset.addEventListener("change", syncCron);
  syncCron();

  // --- 編集時は既存の値を戻す ---
  if (initialSpec) {
    if (kind.value === "daily") {
      const [h, m] = initialSpec.split(":");
      hour.value = String(Number(h));
      // 5分刻みに無い値（例 04:07）でも選べるように選択肢を足す
      if (!Array.from(minute.options).some(o => o.value === String(Number(m)))) {
        minute.appendChild(el("option", { value: String(Number(m)), text: m + "分" }));
      }
      minute.value = String(Number(m));
    } else if (kind.value === "once") {
      const [d, t] = initialSpec.split("T");
      if (d) { date.value = d; if (d < date.min) date.min = d; }
      if (t) time.value = t.slice(0, 5);
    } else {
      const preset = CRON_PRESETS.find(p => p.value === initialSpec);
      cronPreset.value = preset ? preset.value : "";
      syncCron();
      cronCustom.value = initialSpec;
    }
  }

  const boxes = { daily: dailyBox, once: onceBox, cron: cronBox };
  const holder = el("div");
  function syncKind() {
    clear(holder);
    holder.appendChild(boxes[kind.value]);
    if (onKindChange) onKindChange(kind.value);
  }
  kind.addEventListener("change", syncKind);
  syncKind();

  return {
    kindNode: kind,
    specNode: holder,
    get kind() { return kind.value; },
    spec() {
      if (kind.value === "daily") {
        return String(hour.value).padStart(2, "0") + ":" + String(minute.value).padStart(2, "0");
      }
      if (kind.value === "once") {
        if (!date.value || !time.value) return "";
        return date.value + "T" + time.value + ":00";
      }
      return cronCustom.value.trim();
    },
    validate() {
      const spec = this.spec();
      if (!spec) return "日時を入力してください";
      if (kind.value === "once" && new Date(spec) <= new Date()) return "未来の日時を指定してください";
      if (kind.value === "cron" && spec.split(/\s+/).length !== 5) {
        return "cron 式は「分 時 日 月 曜」の5項目です";
      }
      return null;
    },
  };
}

const ACTION_LABELS = { restart: "再起動", stop: "停止", start: "起動" };

function renderSchedules(root) {
  const tzInfo = el("div", { class: "lead mono" });
  root.appendChild(el("div", { class: "pagehead" }, [
    el("div", null, [el("h1", { text: "スケジュール" }), tzInfo]),
    el("div", { class: "right" }, [
      gate(el("button", {
        class: "btn primary", text: "＋ 予約を追加",
        onclick: () => openScheduleModal(null, load),
      })),
    ]),
  ]));

  const note = readOnlyNote("閲覧のみです。予約の追加・変更・削除にはログインが必要です。");
  if (note) root.appendChild(note);

  const list = el("div");
  const side = el("div");
  root.appendChild(el("div", { class: "chartgrid", style: "grid-template-columns:minmax(0,2fr) minmax(280px,1fr)" }, [
    list, side,
  ]));

  /** 次に動く予約を目立たせる。一覧だけだと「次に何が起きるか」が読み取りにくい */
  function paintNext(schedules) {
    clear(side);
    const next = schedules.find(s => s.enabled && s.next_action_at);
    if (!next) {
      side.appendChild(el("div", { class: "panel muted", text: "有効な予約はありません" }));
    } else {
      const at = new Date(next.next_action_at);
      const remain = Math.max(0, (at.getTime() - Date.now()) / 1000);
      side.appendChild(el("div", {
        class: "panel",
        style: "background:linear-gradient(160deg,#153854,#102a3f);border-color:#21455f",
      }, [
        el("div", { style: "font-size:15px;font-weight:700;margin-bottom:14px", text: "次に実行される予約" }),
        el("div", { class: "row", style: "gap:8px;margin-bottom:10px" }, [
          el("span", { class: "tag-changed", text: next.action_label }),
          el("span", { class: "tag-added", style: "background:#17334b;color:#9dbdd6",
            text: { daily: "毎日", once: "単発", cron: "cron" }[next.kind] || next.kind }),
          next.skip_next ? el("span", { class: "tag-unknown", text: "今回は見送り" }) : null,
        ]),
        el("div", { class: "mono", style: "font-size:22px;font-weight:700;color:#fff",
          text: fmtTime(next.next_action_at) }),
        el("div", { class: "mono small muted", style: "margin-top:8px",
          text: next.skip_next ? "この回は実行されません" : "あと " + fmtDuration(remain) }),
        next.pending_changes
          ? el("div", { class: "small muted", style: "margin-top:12px",
              text: "保留中の設定変更 " + next.pending_changes + " 件を同時に反映します。" })
          : null,
        el("div", { class: "row", style: "margin-top:16px" }, [
          gate(el("button", {
            class: "btn small", text: "編集", style: "flex:1",
            onclick: () => openScheduleModal(next, load),
          })),
          gate(el("button", {
            class: "btn small", text: next.skip_next ? "見送りをやめる" : "今回はスキップ",
            style: "flex:1",
            onclick: () => toggleSkip(next),
          })),
        ]),
      ]));
    }
    side.appendChild(el("div", { class: "panel", style: "margin-top:20px" }, [
      el("div", { style: "font-size:14px;font-weight:700;margin-bottom:10px", text: "メンテ枠の作り方" }),
      el("div", { class: "small muted",
        text: "設定ファイルを変更したい場合は「停止」と「起動」を別々に予約してメンテ枠を作り、"
            + "停止が完了してからゲーム設定タブで編集してください"
            + "（サーバは停止時に設定ファイルを上書きするため、停止前の編集は失われます）。" }),
    ]));
  }

  async function toggleSkip(s) {
    try {
      await patch("/api/schedules/" + s.id, { skip_next: !s.skip_next });
      toast(s.skip_next ? "見送りを取り消しました" : "次の1回だけ見送ります", "ok");
      load();
    } catch (e) { toast(e.message, "err"); }
  }

  function openScheduleModal(existing, onDone) {
    // 何をするか。起動だけは予告を伴わない
    const action = el("select", null, [
      el("option", { value: "restart", text: "再起動（予告 → 保存 → 停止 → 起動）" }),
      el("option", { value: "stop", text: "停止（予告 → 保存 → 停止）" }),
      el("option", { value: "start", text: "起動（即時。予告なし）" }),
    ]);
    action.value = (existing && existing.action) || "restart";

    // 種別を切り替えたら注意書きも切り替える
    const specHint = el("div", { class: "muted small" });
    function updateHint(kind) {
      const verb = ACTION_LABELS[action.value] || "実行";
      specHint.textContent = action.value === "start"
        ? "指定時刻に起動します。予告が無いので時刻どおりに実行されます。"
        : kind === "cron"
          ? `cron はその時刻から予告が始まるため、実際の${verb}は予告リードぶん後になります。`
          : `指定時刻ちょうどに${verb}されるよう、予告はその手前から始まります。`;
    }
    const picker = specPicker(existing && existing.kind, existing && existing.spec, updateHint);
    const label = el("input", { type: "text", placeholder: "メモ（任意）", value: (existing && existing.label) || "" });

    const isStop = action.value === "stop";
    const fields = announceFields({
      message: (existing && existing.announce_message)
        || (state.config && (isStop ? state.config.stop_announce_template
                                    : state.config.restart_announce_template)) || "",
      offsets: (existing && existing.notice_offsets)
        || (state.config && state.config.notice_offsets) || [300, 60, 30],
    });

    // 起動のときはアナウンス欄を隠す（送る相手がいない）
    const announceBox = el("div", null, fields.nodes);
    const startNote = el("div", { class: "infobox", style: "display:none",
      text: "停止中のサーバにはアナウンスを送れないため、起動の予約に予告はありません。" });
    function syncAction() {
      const start = action.value === "start";
      announceBox.style.display = start ? "none" : "";
      startNote.style.display = start ? "" : "none";
      updateHint(picker.kind);
    }
    action.addEventListener("change", syncAction);

    openModal({
      title: existing ? "予約を編集します" : "予約を追加します",
      lead: "指定した時刻にサーバの状態を変更します。",
      confirmLabel: existing ? "更新する" : "追加する",
      body: [
        field("動作", action),
        field("繰り返し方", picker.kindNode),
        el("div", { class: "field" }, [
          el("label", { text: "日時" }), picker.specNode, specHint,
        ]),
        field("メモ", label),
        startNote,
        announceBox,
      ],
      validate() {
        const err = picker.validate();
        if (err) return err;
        return action.value === "start" ? null : fields.validate();
      },
      async onConfirm() {
        const payload = { kind: picker.kind, spec: picker.spec(),
                          label: label.value.trim(), action: action.value };
        if (action.value !== "start") Object.assign(payload, fields.payload());
        if (existing) await patch("/api/schedules/" + existing.id, payload);
        else await post("/api/schedules", payload);
        toast(existing ? "予約を更新しました" : "予約を追加しました", "ok");
        if (onDone) onDone();
      },
    });
    syncAction();
  }

  async function load() {
    let data;
    try { data = await api("/api/schedules"); }
    catch (e) { toast(e.message, "err"); return; }
    tzInfo.textContent = "タイムゾーン: " + data.timezone;
    paintNext(data.schedules);
    clear(list);
    if (!data.schedules.length) {
      list.appendChild(el("div", { class: "panel muted", text: "予約はありません" }));
      return;
    }
    const wrap = el("div", { class: "tablewrap" });
    const table = el("table");
    table.appendChild(el("thead", null, el("tr", null,
      ["動作", "繰り返し", "指定", "メモ", "予告", "設定変更", "次回実行", "状態", ""]
        .map(h => el("th", { text: h })))));
    const tbody = el("tbody");
    for (const s of data.schedules) {
      const offsets = s.notice_offsets && s.notice_offsets.length
        ? s.notice_offsets.map(offsetLabel).join(" / ") : "既定";
      tbody.appendChild(el("tr", null, [
        el("td", null, el("strong", { text: s.action_label || ACTION_LABELS[s.action] || s.action })),
        el("td", { text: { daily: "毎日", once: "単発", cron: "cron" }[s.kind] || s.kind }),
        el("td", { text: s.spec }),
        el("td", { text: s.label || "-" }),
        s.announced
          ? el("td", null, [
              el("div", { class: "small", text: offsets }),
              el("div", { class: "muted small", text: s.announce_message || "既定の文面" }),
            ])
          : el("td", { class: "muted small", text: "予告なし" }),
        s.pending_changes
          ? el("td", null, el("span", { class: "tag-added", text: s.pending_changes + " 件反映" }))
          : el("td", { class: "muted small", text: "-" }),
        el("td", { class: "mono", text: fmtTime(s.next_action_at) }),
        el("td", null, s.skip_next
          ? el("span", { class: "tag-unknown", text: "今回は見送り" })
          : el("span", { class: s.enabled ? "" : "muted", text: s.enabled ? "有効" : "無効" })),
        el("td", null, el("div", { class: "row" }, [
          gate(el("button", { class: "btn small", text: "編集", onclick: () => openScheduleModal(s, load) })),
          gate(el("button", {
            class: "btn small", text: s.skip_next ? "見送りをやめる" : "今回はスキップ",
            onclick: () => toggleSkip(s),
          })),
          gate(el("button", {
            class: "btn small", text: s.enabled ? "無効化" : "有効化",
            onclick: async () => {
              try { await patch("/api/schedules/" + s.id, { enabled: !s.enabled }); load(); }
              catch (e) { toast(e.message, "err"); }
            }
          })),
          gate(el("button", {
            class: "btn small danger", text: "削除",
            onclick: () => openModal({
              title: "予約を削除します",
              lead: (s.label || s.spec) + " の予約を削除します。",
              danger: true,
              confirmLabel: "削除する",
              async onConfirm() { await del("/api/schedules/" + s.id); toast("削除しました", "ok"); load(); },
            }),
          })),
        ])),
      ]));
    }
    table.appendChild(tbody);
    wrap.appendChild(table);
    list.appendChild(wrap);
  }
  load();
  state.refresher = setInterval(load, 15000);
}

// ログ（WebSocket ストリーミング）
// --------------------------------------------------------------------------
function renderLogs(root) {
  const LEVELS = [
    { key: "", label: "ALL", color: "" },
    { key: "info", label: "INFO", color: "" },
    { key: "warn", label: "WARN", color: "var(--warn)" },
    { key: "error", label: "ERROR", color: "var(--crit)" },
  ];
  let filter = "";
  let counts = { info: 0, warn: 0, error: 0 };

  const dot = el("span", { class: "statusdot" });
  const status = el("span", { class: "small muted", text: "接続中…" });
  const pills = el("div", { class: "chips" });
  const autoscroll = el("input", { type: "checkbox" });
  autoscroll.checked = true;
  const box = el("div", { id: "log" });

  root.appendChild(el("div", { class: "pagehead" }, [
    el("div", null, [
      el("h1", { text: "ログ" }),
      el("div", { class: "row", style: "gap:8px;margin-top:8px" }, [dot, status]),
    ]),
    el("div", { class: "right" }, [
      pills,
      el("label", { class: "row small muted", style: "gap:6px" }, [autoscroll, "自動スクロール"]),
      el("button", { class: "btn small", text: "クリア", onclick: () => { buffer.length = 0; repaint(); } }),
    ]),
  ]));
  root.appendChild(box);

  // 受け取った行は全部持っておき、表示だけ絞る。
  // 絞り込みを戻したときにサーバへ取り直しに行かなくて済む
  const buffer = [];

  function paintPills() {
    clear(pills);
    for (const lv of LEVELS) {
      const n = lv.key ? counts[lv.key] : null;
      pills.appendChild(el("button", {
        class: "chip" + (lv.key === filter ? " on" : ""),
        style: lv.key !== filter && lv.color ? "color:" + lv.color : "",
        text: lv.label + (n ? " " + n : ""),
        onclick: () => { filter = lv.key; paintPills(); repaint(); },
      }));
    }
  }

  function lineNode(record) {
    const level = record.level || "info";
    return el("div", { class: "ln" }, [
      el("span", { class: "lt", text: fmtClock(record.ts) }),
      el("span", { class: "lv " + level, text: level.toUpperCase() }),
      el("span", { class: "lm" + (record.source === "app" ? " app" : ""), text: record.line }),
    ]);
  }

  function repaint() {
    clear(box);
    for (const r of buffer) {
      if (!filter || (r.level || "info") === filter) box.appendChild(lineNode(r));
    }
    if (autoscroll.checked) box.scrollTop = box.scrollHeight;
  }

  function append(record) {
    buffer.push(record);
    while (buffer.length > 2000) buffer.shift();
    const level = record.level || "info";
    counts[level] = (counts[level] || 0) + 1;
    paintPills();
    if (filter && level !== filter) return;
    box.appendChild(lineNode(record));
    while (box.childElementCount > 2000) box.removeChild(box.firstChild);
    if (autoscroll.checked) box.scrollTop = box.scrollHeight;
  }

  paintPills();

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(proto + "//" + location.host + "/ws/logs");
  state.ws = ws;
  ws.onopen = () => {
    dot.className = "statusdot online";
    status.textContent = "接続済み";
  };
  ws.onmessage = (ev) => { try { append(JSON.parse(ev.data)); } catch (e) { /* 無視 */ } };
  ws.onclose = () => {
    dot.className = "statusdot offline";
    status.textContent = "切断されました（画面を切り替えると再接続します）";
  };
  ws.onerror = () => {
    dot.className = "statusdot offline";
    status.textContent = "接続エラー";
  };
}

/** 上部バーの状態を切らさないための取得。
 *
 *  各画面のタイマーは画面を切り替えるたびに止まるので、上部バーだけ
 *  別で回す。サーバ側は同じ秒内の問い合わせをまとめるので、
 *  ダッシュボードと二重に叩いてもゲームサーバへの負荷は増えない。
 */
function startStatusPolling() {
  if (state.statusTimer) clearInterval(state.statusTimer);
  const tick = async () => {
    try { state.status = await api("/api/status"); }
    catch (e) { /* 上部バーのために画面全体を壊さない */ }
    buildTopbar();
  };
  tick();
  state.statusTimer = setInterval(tick, 5000);
}

async function start() {
  try {
    state.config = await api("/api/config");
  } catch (e) {
    // 設定が取れないと操作の可否も判断できず、見た目は未ログインと同じになる。
    // 黙って閲覧専用にすると原因が分からないので、はっきり出す。
    // バナーは各画面が自分の状態で上書きするため、トーストでも出しておく
    state.config = null;
    toast("設定の取得に失敗しました: " + e.message, "err");
    showBanner("管理ツールの設定を取得できませんでした: " + e.message, "crit");
    setView(state.view || "dashboard");
    return;
  }

  // 画面だけ新しく、API が古いまま動いている状態（静的ファイルは毎回
  // ディスクから読まれるので、管理ツールを再起動し忘れると起きる）。
  // ログインしても操作可否を判定できず「ログインが反映されない」ように見えるので、
  // 症状ではなく原因を出す
  if (state.config.authenticated === undefined) {
    toast("管理ツールの再起動が必要です（画面と API のバージョンが揃っていません）", "err");
  }
  setView(state.view || "dashboard");
  startStatusPolling();
}

(async function main() {
  $("login-submit").addEventListener("click", submitLogin);
  $("login-cancel").addEventListener("click", browseAsGuest);
  for (const id of ["login-username", "login-password"]) {
    $(id).addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") submitLogin();
    });
  }

  // 未ログインでも閲覧はできるので、まず画面を出す。
  // ログイン画面は、操作したくなったときにサイドバーから開く
  hideLogin();
  await start();
})();
</script>
</body>
</html>
